---
# Inventory — homelab
#
# Naming convention : short name in inventory, FQDN = <name>.host.puhome.net
# IP range          : 10.0.2.2, 10.0.2.11 – 10.0.2.20
# SSH               : single 'ansible' user, shared key (keys/ansible_rsa.private)
#
# Groups
# ───────────────────────────────────────────────────────────────────
#   managed          → all hosts Ansible actively manages
#     linux          → Debian/Ubuntu — apt, systemd, docker
#     macos          → macOS — Homebrew, launchd
#   unmanaged        → reference-only entries; no tasks run against these
#
# Functional cross-cutting groups (for targeted role application)
#   gpu_nodes        → hosts with a GPU (currently c01)
#   storage_nodes    → NAS / storage hosts

all:
  children:
    # ── Managed ────────────────────────────────────────────────────
    managed:
      children:

        # Debian/Ubuntu Linux hosts
        linux:
          hosts:
            gw01:
              ansible_host: 10.0.2.2     # Raspberry Pi 5 · Debian · gateway
            util01:
              ansible_host: 10.0.2.11    # Mini PC (Skullcandy) · Debian · utility
            c01:
              ansible_host: 10.0.2.12    # Custom PC + GPU · Debian · compute

        # macOS hosts
        macos:
          hosts:
            admin01:
              ansible_host: 10.0.2.13    # Mac Mini M1 · macOS · admin / jumphost
            ai01:
              ansible_host: 10.0.2.14    # Mac Mini M4 Pro · macOS · AI workloads

    # ── Unmanaged (reference only) ──────────────────────────────────
    unmanaged:
      hosts:
        nas01:
          ansible_host: 10.0.2.18        # TrueNAS · primary storage
        nas02:
          ansible_host: 10.0.2.19        # Synology · backup
        ha01:
          ansible_host: 10.0.2.20        # Home Assistant OS · IoT hub

    # ── Functional groups ──────────────────────────────────────────
    gpu_nodes:
      hosts:
        c01:                            # c01 doubles as a GPU compute node

    storage_nodes:
      hosts:
        nas01:
        nas02:
