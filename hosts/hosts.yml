---
# Inventory — homelab
#
# Naming convention : short name in inventory, FQDN = <name>.host.puhome.net
# Subnet            : 10.0.2.0/24 (Omada-managed, dual-WAN load share)
# SSH               : single 'ansible' user, shared key (keys/ansible_rsa.private)
#
# Groups
# ───────────────────────────────────────────────────────────────────
#   managed          → hosts Ansible actively provisions
#     linux          → Debian — apt, systemd, docker
#     macos          → macOS — Homebrew, launchd
#   unmanaged        → reference-only entries; no plays run against these
#
# Functional cross-cutting groups (for targeted role application)
#   docker_hosts     → hosts running the Docker engine
#   gpu_nodes        → hosts with a GPU (cmp01 · NVIDIA A4000)
#   storage_nodes    → NAS / storage hosts
#   backup_clients   → hosts whose state is backed up to nas02

all:
  children:
    # ── Managed ────────────────────────────────────────────────────
    managed:
      children:

        # Debian hosts
        linux:
          hosts:
            gw01:
              ansible_host: 10.0.2.2     # Raspberry Pi 5 · Debian · DNS + reverse proxy
            cmp01:
              ansible_host: 10.0.2.5     # 8c/16t · 32 GB · NVIDIA A4000 · primary compute
            util01:
              ansible_host: 10.0.2.8     # Mini PC · Debian · observability + ops

        # macOS hosts
        macos:
          hosts:
            ai01:
              ansible_host: 10.0.2.9     # Mac Mini M4 Pro · local LLM inference
            ctl01:
              # TODO: currently a DHCP lease (.115). Reserve 10.0.2.4 in the
              # Omada controller, then change this to 10.0.2.4.
              ansible_host: 10.0.2.115   # Mac Mini M1 · jumphost + Ansible control node

        # DNS appliance — Raspberry Pi Zero running Pi-hole. Managed for its
        # config only (conditional-forward to Blocky); NOT in 'linux', so it
        # never gets the docker/full bootstrap (it's a tiny armv6 box).
        dns:
          hosts:
            dns01:
              ansible_host: 10.0.2.7     # Raspberry Pi Zero · Pi-hole · ad/tracker blocking

    # ── Unmanaged (reference only) ──────────────────────────────────
    unmanaged:
      hosts:
        router:
          ansible_host: 10.0.2.1         # Omada router · dual-WAN (ACT Fibernet + Airtel Black)
        nas02:
          ansible_host: 10.0.2.3         # Synology · 4 TiB RAID1 mirror · backup target
        nas01:
          ansible_host: 10.0.2.6         # TrueNAS · RAIDZ2 · primary storage (NFS)
        omada:
          ansible_host: 10.0.2.21        # Omada controller

    # ── Functional groups ──────────────────────────────────────────
    docker_hosts:
      hosts:
        gw01:
        cmp01:
        util01:

    gpu_nodes:
      hosts:
        cmp01:                             # NVIDIA A4000 — Jellyfin NVENC, Whisper subtitles

    storage_nodes:
      hosts:
        nas01:
        nas02:

    backup_clients:
      hosts:
        cmp01:
        util01:
        gw01:
