---
# gw01 host vars — the central reverse-proxy map. Every *.puhome.net service is
# added here as it comes online; nginx templates a vhost per entry.
#   name     : subdomain (<name>.puhome.net)
#   upstream : proxy_pass target
#   sso      : gate behind Authentik forward-auth (omit/false = public)

nginx_sites:
  # Identity — NOT behind SSO (it IS the login)
  - { name: auth,       upstream: "http://10.0.2.8:9000", sso: false }   # Authentik

  # Observability / ops (util01) — admin UIs behind SSO
  - { name: metrics,    upstream: "http://10.0.2.8:8090", sso: false }   # Beszel hub — tier-1 OIDC (own login); forward-auth breaks its OAuth callback
  - { name: synthetics, upstream: "http://10.0.2.8:3001", sso: true }    # Uptime Kuma
  - { name: dash,       upstream: "http://10.0.2.8:8094", sso: true }    # Homepage
  - { name: docker,     upstream: "http://10.0.2.8:9001", sso: false }   # Portainer — tier-1 OIDC (own login)
  - { name: logs,       upstream: "http://10.0.2.8:8093", sso: true }    # Dozzle
  - { name: sync,       upstream: "http://10.0.2.8:8384", sso: true }    # Syncthing GUI

  # ntfy — public (apps POST notifications; phone subscribes). Own ACLs later.
  - { name: ntfy,       upstream: "http://10.0.2.8:8091", sso: false }
  # n8n — own auth + receives webhooks (phase 7 GitOps); not forward-authed.
  - { name: n8n,        upstream: "http://10.0.2.8:5678", sso: false }
  - { name: git,        upstream: "http://10.0.2.5:8102", sso: false }   # Gitea — own auth; forward-auth breaks git-over-HTTPS and the API
  # Family helpdesk. `sso: false` is THE POINT, not an oversight: the whole
  # purpose is that family members file and read tickets without a login, and
  # forward-auth would defeat it. Acceptable only because this fleet's
  # subdomains do not resolve publicly (verified: git.puhome.net has no public
  # A record), so an unauthenticated write endpoint stays on the LAN. Revisit
  # this line if that ever changes.
  - { name: help,       upstream: "http://10.0.2.8:8103", sso: false }   # tickets (util01)
  # ssh.git exists only to carry Gitea's SSH listener (see blocky's
  # blocky_extra_mappings). Anyone reaching it over HTTP has typed the wrong
  # thing; bounce them to the web UI rather than a connection error.
  - { name: ssh.git,    redirect_to: "https://git.puhome.net", sso: false }

  # Compute / media (cmp01) — native clients, so own auth (not forward-auth)
  - { name: video,      upstream: "http://10.0.2.5:8096", sso: false }   # Jellyfin
  - { name: seer,       upstream: "http://10.0.2.5:5055", sso: false }   # Jellyseerr
  - { name: books,      upstream: "http://10.0.2.5:5000", sso: false }   # Kavita 0.8.2
  - { name: docs,       upstream: "http://10.0.2.5:8000", sso: false }   # Paperless-ngx
  # paperless-ai holds a Paperless superuser token and can rewrite every
  # document, so its UI is SSO-gated even though Paperless itself is not
  # (Paperless stays open for API/mobile clients that cannot do forward-auth).
  - { name: docs-ai,    upstream: "http://10.0.2.5:3000", sso: true }    # paperless-ai (LLM tagging + RAG chat)
  # Knowledge base (phase 9a). The wiki republishes whole vaults including
  # Secrets/ and Finances/ by the user's 2026-09-01 decision, so forward-auth is
  # the only thing standing in front of it — it is never exposed off-LAN.
  - { name: wiki,       upstream: "http://10.0.2.5:8101", sso: true }    # Quartz (Obsidian vaults)
  - { name: ask,        upstream: "http://10.0.2.5:8100", sso: true }    # wiki search (hybrid BM25 + vector)
  # Research agent (phase 10) — the FIRST published service on ctl01 (10.0.2.4).
  # Every other entry here is util01 or cmp01. It lives on ctl01 by user
  # direction; docs/spec/research.md explains why that is safe despite ctl01
  # holding the vault password. SSO-gated: it commissions work on the LLM and
  # writes into the wiki, so it is never anonymous.
  - { name: research,   upstream: "http://10.0.2.4:8110", sso: true }    # researchd (agent UI + API)
  - { name: files,      upstream: "http://10.0.2.5:8085", sso: true }    # Filebrowser (media mgmt)
  - { name: soulseek,   upstream: "http://10.0.2.5:5030", sso: true }    # slskd (Soulseek)
  - { name: music,      upstream: "http://10.0.2.5:4533", sso: false }   # Navidrome (native auth for Subsonic clients)
  - { name: lms,        upstream: "http://10.0.2.5:9000", sso: true }    # Lyrion Music Server (WiiM); admin UI only
  - { name: soularr,    upstream: "http://10.0.2.5:8265", sso: true }    # Soularr (music bridge UI)

  # arr stack (cmp01) — admin web UIs behind SSO (inter-app APIs bypass nginx)
  - { name: nzbget,     upstream: "http://10.0.2.5:6789", sso: true }    # Usenet (primary)
  - { name: torrent,    upstream: "http://10.0.2.5:8080", sso: true }    # qBittorrent
  - { name: prowlarr,   upstream: "http://10.0.2.5:9696", sso: true }
  - { name: sonarr,     upstream: "http://10.0.2.5:8989", sso: true }
  - { name: radarr,     upstream: "http://10.0.2.5:7878", sso: true }
  - { name: lidarr,     upstream: "http://10.0.2.5:8686", sso: true }
  - { name: bazarr,     upstream: "http://10.0.2.5:6767", sso: true }

# gw01 runs Blocky, so its own /etc/resolv.conf points at loopback. Docker
# refuses to hand a loopback resolver to containers and falls back to public
# DNS, which bypasses Blocky's AAAA filtering and returns IPv6-only answers on
# this IPv4-only network. Point container DNS at Blocky on the LAN address.
docker_daemon_dns:
  - "{{ hostvars['gw01'].ansible_host }}"
