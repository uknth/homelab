---
# util01 host vars

# ops/restic — Syncthing data is the only thing util01 backs up (user directive).
restic_paths:
  - "{{ service_root }}/syncthing/data"

# --- GitOps deploy trigger -------------------------------------------------
# Public half of the keypair Gitea Actions uses to trigger a deploy.
#
# ROTATED 2026-09-08. The first key leaked: deploy.yml passed the private half
# through a step `env:` block, act_runner echoes that block into the job log,
# and Gitea's secret masking did not match the multiline PEM — so the whole
# key, header to footer, was printed in a readable Actions log. The private
# half is now stored BASE64-ENCODED (single line) precisely because masking a
# one-line value is something Gitea does reliably. Its
# PRIVATE half is stored as the `GITOPS_TRIGGER_KEY` secret in Gitea and
# exists nowhere else — not in this repo, not in the vault.
#
# Safe to commit: it is a public key, and it is authorised in authorized_keys
# ONLY against `command="gitops-trigger.sh"` with pty/forwarding disabled. The
# worst a leak of the matching private key permits is running that wrapper,
# which accepts exactly two verbs (`apply`, `check <ref>`) and validates the
# ref before it reaches git. It cannot run an arbitrary command.
gitops_ci_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN+RxWntHyaiehhn8vTkzFU3/z2WsnSjQxllzGAxKnO2 gitea-actions-trigger-r2@puhome.net"
