# Ansible Global Config
#---------------------------------------------------------------

# role/ansible_user
ansible_user_name: "ansible"
ansible_user_shell: "/bin/bash"
ansible_user_realname: "Ansible"
ansible_user_public_key: "{{ vault_public_key }}"
ansible_user_sudo_password: "{{ vault_sudo_password }}"

# Connection settings — applied to all hosts
# ansible builtin variables
ansible_user: "{{ ansible_user_name }}"
ansible_ssh_private_key_file: keys/ansible_rsa.private
ansible_become_password: "{{ vault_sudo_password }}"

# The service account that owns homelab state on managed hosts. Same as the
# ansible user by default; referenced by config_dir/data_dir and Docker roles.
user: "{{ ansible_user_name }}"

base_domain: "puhome.net"

# Persistent state lives on each host's LOCAL disk under /opt/homelab.
# Bulk media lives on the NFS mount (media_root), never here — see docs/spec/storage.md.
service_root: "/opt/homelab"
config_dir: "{{ service_root }}/config"
data_dir: "{{ service_root }}/data"

# Single NFS mount from nas01 (10.0.2.6). The export IS the "data" handoff dir
# (holds downloads/, movies/, shows/, music/, ... on one filesystem so hardlinks
# and atomic moves work). Mounted at media_data_dir. See docs/spec/storage.md.
media_nfs_server: "{{ hostvars['nas01'].ansible_host }}"   # 10.0.2.6
media_nfs_export: "/mnt/data-pool/media/data"              # existing TrueNAS NFS export

# Gitea's repositories, on the same TrueNAS. These live in group_vars rather
# than in the gitea role's defaults because TWO separate plays need them and
# role defaults do not cross plays: cmp01 mounts the export (system/nfs_mounts)
# and nas01 DEFINES it (services/storage/truenas_nfs). A role default would be
# undefined in nas01's play, which never loads the gitea role at all.
#
# The dataset itself must be created by hand on TrueNAS before either works —
# that role manages export definitions, never datasets. Owner uid:gid 1000:1000
# to match Gitea's container user.
gitea_nfs_export: "/mnt/data-pool/gitea"
gitea_repos_dir: "/mnt/gitea"                              # mount point on cmp01

# Gitea's LOCAL state (app.ini + the SQLite db). Here rather than in the gitea
# role's defaults for the same reason as the two lines above: cmp01's
# restic_paths references it, and ops/restic runs in a DIFFERENT play that
# never loads the gitea role — so a role default is undefined exactly where
# the backup scope is evaluated. That failed site.yml --check with
# "'gitea_data_dir' is undefined" and blocked the first pipeline deploy.
gitea_root_dir: "{{ service_root }}/gitea"
gitea_data_dir: "{{ gitea_root_dir }}/data"
media_root: "/mnt/media"
media_data_dir: "{{ media_root }}/data"                    # local mount point == the export

# Scratch pool (separate healthy pool on nas01) for in-progress/incomplete
# downloads — keeps write churn off the RAIDZ2 data-pool. Completed downloads
# still land on data-pool (same fs as the library) so hardlinks/atomic moves work.
scratch_nfs_export: "/mnt/scratch-pool/incomplete"
scratch_incomplete_dir: "/mnt/scratch/incomplete"

# Media ownership: the existing library on the NAS is already owned by uid/gid
# 1001 (the `ansible` user on cmp01), so we align to that rather than forcing a
# new GID and chowning 500+ items. Containers run PUID/PGID = these.
media_uid: 1001
media_gid: 1001

timezone: Asia/Kolkata

# Authentik OIDC endpoints (shared by apps configuring OAuth/OIDC)
authentik_url: "https://auth.{{ base_domain }}"
authentik_oidc_authorize_url: "{{ authentik_url }}/application/o/authorize/"
authentik_oidc_token_url: "{{ authentik_url }}/application/o/token/"
authentik_oidc_userinfo_url: "{{ authentik_url }}/application/o/userinfo/"

# Beszel monitoring hub public key — every agent (Linux systemd + macOS launchd)
# authenticates the hub with this. Fleet-wide, so it lives in `all` (not just
# `linux`) now that macOS hosts run agents too. Empty until the hub exists.
beszel_agent_key: "{{ vault_beszel_agent_key | default('') }}"

# --- services/ai/omlx (ai01) -----------------------------------------------
# Resident MLX inference server — the one model the fleet's budget allows (24
# GB unified memory on ai01 fits exactly one). Serves research synthesis now,
# vault Q&A later. See
# docs/spec/research.md#inference--ai01-runs-omlx-and-only-omlx. The binary
# version and model identity are pinned in the role's own defaults
# (roles/services/ai/omlx/defaults/main.yml) instead of here — those are
# facts about the role, not this deployment.
omlx_host: "10.0.2.9,127.0.0.1"   # LAN address explicit — never 0.0.0.0, see research.md
omlx_port: 8000
omlx_api_key: "{{ vault_omlx_api_key }}"

# Memory ceiling for the inference server. We set an EXPLICIT ceiling in GB
# rather than one of omlx's named tiers, because the tiers are opaque and both
# plausible ones were measured wrong for this model on this box (2026-09-03):
#
#   safe      static ceiling 16.00 GB — below the model's 16.80 GB of weights,
#             so it never loaded at all (HTTP 507).
#   balanced  static ceiling 18.00 GB — the model loads (16.30 GB resident),
#             but omlx's prefill guard caps at 90% of the ceiling = 16.20 GB,
#             which is BELOW the resident weights, so every request was
#             rejected before it started (HTTP 400 prefill_memory_exceeded).
#
# The arithmetic for 21 GB on a 24 GB host:
#   prefill cap = 90% x 21.00 = 18.90 GB
#   minus the 16.30 GB the loaded weights already occupy
#   = ~2.6 GB left for KV cache and prefill transients, which at ~98 KB/token
#     (48 layers, 4 KV heads x 128, fp16) is roughly a 26k-token prompt before
#     the paged SSD cache has to take over. Comfortably more than the research
#     agent's per-source summarisation prompts need.
# That leaves 3 GB for macOS. It is a ceiling, not a reservation — omlx only
# ever commits what it actually uses — and it stays under this host's 22.0 GB
# iogpu GPU-allocation cap.
#
# If a genuinely long-context job starts getting rejected, raise this
# deliberately; that is the entire point of using a number instead of a tier.
omlx_memory_guard_gb: 21

# Fallback only — ignored whenever omlx_memory_guard_gb above is set. Kept so
# the role still works on a host where we have not sized a ceiling by hand.
omlx_memory_guard: "balanced"

# macOS caps how much unified memory Metal may wire, and that cap — not
# omlx_memory_guard_gb above — is the real ceiling. Left at its default (0,
# i.e. ~75% of RAM = 17.76 GB on this 24 GB box) it sits barely above the
# model's 16.36 GB resident size, so omlx rejected prompts as small as 1,056
# tokens: "predicted peak would exceed prefill safety cap 16.9GB (95% of
# metal_cap ceiling 17.8GB)". Raising omlx_memory_guard_gb alone does nothing,
# because omlx clamps its own ceiling to metal_cap.
#
# 20 GB of 24 GB, leaving 4 GB for macOS. This is the usual working value for
# LLM inference on a 24 GB Apple Silicon box; going much higher starves the OS
# rather than helping, since the weights are already resident.
omlx_iogpu_wired_limit_mb: 20480

# SSD-backed paged KV cache — the actual relief valve for the budget above.
# 40 GB, NOT the tool's 100 GB default: ai01 has ~149 GB free, and a cache
# allowed to reach 100 GB could take the boot volume to ~99 % full, which on
# macOS degrades the whole machine (and the 189 GB Photos library on the same
# volume is still growing). 40 GB is already enormous for KV pages, and it is
# a cache — it evicts rather than failing when it hits the ceiling.
omlx_paged_ssd_cache_max_size: "40GB"

omlx_root_dir: "{{ service_root }}/omlx"
omlx_model_dir: "{{ omlx_root_dir }}/models"
omlx_paged_ssd_cache_dir: "{{ omlx_root_dir }}/ssd-cache"

# --- Research agent output tree (cmp01) -------------------------------------
# Where services/knowledge/researchpull unpacks the bundle it fetches from
# researchd on ctl01. Lives here rather than in a role's defaults because THREE
# roles read it: vaultmerge (mounts it as a fourth source), researchpull
# (writes it) and ops/restic (backs it up) — same reasoning as wanwatch_links
# below. A role default would be out of scope in the other two roles.
research_tree_dir: "{{ service_root }}/research/tree"

# Backup verification: restic pings this Uptime Kuma push monitor on success, so
# a missed nightly backup surfaces as a red 'Backups' tile. Token is the push
# monitor created by services/monitoring/uptime_kuma_config.
kuma_backup_push_token: "FJbMvkKkBA"
restic_kuma_push_url: "http://{{ hostvars['util01'].ansible_host }}:3001/api/push/{{ kuma_backup_push_token }}"

# --- Dual-WAN monitoring (ops/wanwatch) ------------------------------------
# The Omada load-shares both uplinks, so a single dead ISP is invisible from the
# LAN. Each link gets an alias IP on gw01 that an Omada policy-routing rule (in
# "Only" mode) forces out that WAN, and the probe tests each one independently.
#
# probe_ip must stay OUTSIDE the DHCP pool (10.0.2.25-254) and be used for
# nothing else — it deliberately loses internet whenever its ISP is down.
# kuma_token comes from the uptime_kuma_config sync output the first time the
# monitors are created; empty means the probe still runs and reports, it just
# does not feed Kuma. See docs/runbooks/dual-wan-monitoring.md.
#
# Read by three roles: ops/wanwatch (gw01, the probe), uptime_kuma_config (the
# push monitors) and services/dashboard/homepage (the widget) — which is why it
# lives here rather than in a role's defaults.
kuma_wan1_push_token: "dlOs3b3J4a"
kuma_wan2_push_token: "kTGKfoavUo"
wanwatch_links:
  - id: wan1
    name: "ACT Fibernet"
    probe_ip: "10.0.2.19"
    kuma_monitor: "WAN1 · ACT Fibernet"
    kuma_token: "{{ kuma_wan1_push_token }}"
  - id: wan2
    name: "Airtel Black"
    probe_ip: "10.0.2.20"
    kuma_monitor: "WAN2 · Airtel Black"
    kuma_token: "{{ kuma_wan2_push_token }}"

# Shared slskd API key (used by slskd + soularr). Set vault_slskd_api_key in the
# vault to override the placeholder; slskd is internal (arr net) + Authentik-gated.
slskd_api_key: "{{ vault_slskd_api_key | default('homelab-soularr-slskd-key') }}"
