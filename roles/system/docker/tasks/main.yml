---
# Install Docker CE from the official repository. Idempotent: on a host that
# already has Docker (e.g. cmp01) the package tasks are no-ops.

- name: Ensure apt keyring directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's GPG key
  become: true
  ansible.builtin.get_url:
    url: "{{ docker_apt_gpg_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository (codename derived from host)
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.asc]
      {{ docker_apt_repo_base }} {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  register: _docker_repo

- name: Update apt cache after adding Docker repo
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: _docker_repo.changed

- name: Install Docker Engine
  become: true
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Install Python Docker bindings
  become: true
  ansible.builtin.apt:
    name: python3-docker
    state: present
  when: docker_install_python_bindings | bool

- name: Ensure docker service is started and enabled
  become: true
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add users to the docker group
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: docker_users | length > 0
