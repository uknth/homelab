---
# system/nfs_mounts — mount NFS shares from nas01 on the consuming host (cmp01).
# The media export is the single "data" handoff dir; state stays on local disk.

nfs_mounts:
  - server: "{{ media_nfs_server }}"
    export: "{{ media_nfs_export }}"
    path: "{{ media_data_dir }}"
    # uid/gid 1001 already own the data; no maproot on the export, so plain sec=sys.
    opts: "rw,vers=4.2,hard,noatime,_netdev"
  # In-progress downloads on the scratch pool (spares the data-pool).
  - server: "{{ media_nfs_server }}"
    export: "{{ scratch_nfs_export }}"
    path: "{{ scratch_incomplete_dir }}"
    opts: "rw,vers=4.2,hard,noatime,_netdev"

nfs_mount_owner: "{{ media_uid }}"
nfs_mount_group: "{{ media_gid }}"
