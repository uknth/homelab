---
# Entry point — dispatches to OS-specific task file.
# Sets hostname to <inventory_hostname>.host.<base_domain> (e.g. admin01.host.puhome.net)

- name: Set hostname (Linux)
  ansible.builtin.import_tasks: linux.yml
  when: ansible_system == "Linux"

- name: Set hostname (macOS)
  ansible.builtin.import_tasks: macos.yml
  when: ansible_system == "Darwin"
