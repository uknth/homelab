---
# Install and run the Beszel agent. No-ops until the hub key is available.
# OS-dispatched: systemd on Linux, launchd on macOS.

- name: Note beszel agent is deferred (no hub key yet)
  ansible.builtin.debug:
    msg: >-
      beszel_agent_key is not set — the Beszel hub (util01, phase 4) isn't up yet.
      Skipping agent install on {{ inventory_hostname }}. Re-run after phase 4.
  when: beszel_agent_key | length == 0

- name: Install Beszel agent (Linux / systemd)
  ansible.builtin.include_tasks: linux.yml
  when:
    - beszel_agent_key | length > 0
    - ansible_system == 'Linux'

- name: Install Beszel agent (macOS / launchd)
  ansible.builtin.include_tasks: macos.yml
  when:
    - beszel_agent_key | length > 0
    - ansible_system == 'Darwin'
