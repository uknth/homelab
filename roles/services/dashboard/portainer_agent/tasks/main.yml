---
- name: Create portainer-agent dirs
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0755"
  loop:
    - "{{ portainer_agent_root_dir }}"
    - "{{ portainer_agent_root_dir }}/compose"
- name: Template portainer-agent compose
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_agent_root_dir }}/compose/docker-compose.yml"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0644"
  notify: Restart portainer_agent
- name: Deploy portainer-agent
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ portainer_agent_root_dir }}/compose"
    project_name: "portainer-agent"
    state: present
    pull: missing
