---
- name: Create portainer dirs
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0755"
  loop:
    - "{{ portainer_root_dir }}"
    - "{{ portainer_root_dir }}/compose"
    - "{{ portainer_root_dir }}/data"
- name: Template portainer compose
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_root_dir }}/compose/docker-compose.yml"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0644"
  notify: Restart portainer
- name: Deploy portainer
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ portainer_root_dir }}/compose"
    project_name: "portainer"
    state: present
    pull: missing

# --- Configure Authentik OAuth (idempotent) ---
- name: Wait for Portainer API
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_port }}/api/system/status"
    status_code: 200
  register: _pt_status
  check_mode: false
  retries: 15
  delay: 3
  until: _pt_status.status == 200

- name: Try to authenticate as admin
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_port }}/api/auth"
    method: POST
    body_format: json
    body: { Username: admin, Password: "{{ portainer_admin_password }}" }
    status_code: [200, 401, 422]
  register: _pt_auth
  check_mode: false
  no_log: true

- name: Initialize admin if not yet set up
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_port }}/api/users/admin/init"
    method: POST
    body_format: json
    body: { Username: admin, Password: "{{ portainer_admin_password }}" }
    status_code: [200, 409]
  when: _pt_auth.status != 200
  no_log: true

- name: Authenticate (get JWT)
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_port }}/api/auth"
    method: POST
    body_format: json
    body: { Username: admin, Password: "{{ portainer_admin_password }}" }
  register: _pt_jwt
  check_mode: false
  no_log: true

- name: Configure Authentik OAuth
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_port }}/api/settings"
    method: PUT
    headers:
      Authorization: "Bearer {{ _pt_jwt.json.jwt }}"
    body_format: json
    body:
      AuthenticationMethod: 3
      OAuthSettings:
        ClientID: "{{ portainer_oidc_client_id }}"
        ClientSecret: "{{ portainer_oidc_client_secret }}"
        AuthorizationURI: "{{ authentik_oidc_authorize_url }}"
        AccessTokenURI: "{{ authentik_oidc_token_url }}"
        ResourceURI: "{{ authentik_oidc_userinfo_url }}"
        RedirectURI: "{{ portainer_url }}"
        UserIdentifier: preferred_username
        Scopes: "openid email profile"
        OAuthAutoCreateUsers: true
        SSO: true
    status_code: 200
  no_log: true
  changed_when: true

# --- Register Docker environments (idempotent) ---
# Pre-provisioning admin via API skips Portainer's setup wizard, so the local
# environment is never auto-created. Add it explicitly, plus an Agent env per
# remote docker host (portainer_agent role must be running there).
- name: Get existing endpoints
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_port }}/api/endpoints"
    headers:
      Authorization: "Bearer {{ _pt_jwt.json.jwt }}"
  register: _pt_eps
  check_mode: false

- name: Create the local (util01) environment
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_port }}/api/endpoints"
    method: POST
    headers:
      Authorization: "Bearer {{ _pt_jwt.json.jwt }}"
    body_format: form-multipart
    body:
      Name: "local"
      EndpointCreationType: "1"
    status_code: [200, 409]
  # Portainer usually auto-creates a local socket env ("primary"); only add one
  # if no local (type 1) environment exists at all.
  when: (_pt_eps.json | selectattr('Type','equalto',1) | list | length) == 0

- name: Create Agent environments for remote docker hosts
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_port }}/api/endpoints"
    method: POST
    headers:
      Authorization: "Bearer {{ _pt_jwt.json.jwt }}"
    body_format: form-multipart
    body:
      Name: "{{ item }}"
      EndpointCreationType: "2"
      URL: "tcp://{{ hostvars[item].ansible_host }}:{{ portainer_agent_port }}"
      TLS: "true"
      TLSSkipVerify: "true"
      TLSSkipClientVerify: "true"
    status_code: [200, 409]
  loop: "{{ portainer_agent_hosts }}"
  when: item not in (_pt_eps.json | map(attribute='Name') | list)

# --- Promote OAuth users to admin (idempotent) ---
# OAuth auto-creates standard users (Role 2) with no environment access, so the
# owner sees nothing. Grant admin to the configured usernames.
- name: Get Portainer users
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_port }}/api/users"
    headers:
      Authorization: "Bearer {{ _pt_jwt.json.jwt }}"
  register: _pt_users
  check_mode: false

- name: Promote configured OAuth users to admin
  ansible.builtin.uri:
    url: "http://localhost:{{ portainer_port }}/api/users/{{ item.Id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ _pt_jwt.json.jwt }}"
    body_format: json
    body:
      Role: 1
    status_code: [200]
  loop: "{{ _pt_users.json }}"
  loop_control:
    label: "{{ item.Username }}"
  when:
    - item.Username in portainer_admin_users
    - item.Role != 1
