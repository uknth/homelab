---
portainer_image: "portainer/portainer-ce:lts"
portainer_root_dir: "{{ service_root }}/portainer"
portainer_port: 9001            # host port (9000 taken by authentik on util01)

# OAuth (Authentik OIDC)
portainer_admin_password: "{{ vault_portainer_admin_password }}"
portainer_oidc_client_id: "{{ vault_portainer_oidc_client_id }}"
portainer_oidc_client_secret: "{{ vault_portainer_oidc_client_secret }}"
portainer_url: "https://docker.{{ base_domain }}"

# Remote docker hosts to register as Portainer Agent environments (need
# services/dashboard/portainer_agent running on them, port 9001). util01 is the
# local socket environment. Defaults to docker_hosts minus util01.
portainer_agent_hosts: "{{ groups['docker_hosts'] | difference(['util01']) }}"
portainer_agent_port: 9001

# OAuth-provisioned users to grant Portainer admin (Role 1). Standard OAuth users
# see no environments, so the homelab owner must be an admin. Portainer CE does
# not reset roles on OAuth login, so this sticks.
portainer_admin_users: ["uknth"]
