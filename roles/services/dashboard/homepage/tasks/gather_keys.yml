---
# Fetch per-app keys at deploy time so nothing secret lands in git. Stable keys
# are read from each app's config (slurp on cmp01); truenas/authentik/qbit come
# from vault; jellyfin/portainer tokens are minted best-effort.

- name: Read *arr config.xml files (cmp01)
  delegate_to: cmp01
  become: true
  ansible.builtin.slurp:
    src: "/opt/homelab/arr/{{ item }}/config.xml"
  register: _arr_cfg
  loop: [sonarr, radarr, lidarr, prowlarr]
  no_log: true

- name: Extract *arr API keys
  ansible.builtin.set_fact:
    hp_keys: "{{ hp_keys | default({}) | combine({ item.item: (item.content | b64decode | regex_findall('<ApiKey>([^<]+)</ApiKey>') | first) }) }}"
  loop: "{{ _arr_cfg.results }}"
  loop_control: { label: "{{ item.item }}" }
  no_log: true

- name: Read bazarr config.yaml (cmp01)
  delegate_to: cmp01
  become: true
  ansible.builtin.slurp:
    src: /opt/homelab/arr/bazarr/config/config.yaml
  register: _bazarr_cfg
  no_log: true

- name: Read nzbget.conf (cmp01)
  delegate_to: cmp01
  become: true
  ansible.builtin.slurp:
    src: /opt/homelab/arr/nzbget/nzbget.conf
  register: _nzb_cfg
  no_log: true

- name: Read jellyseerr settings.json (cmp01)
  delegate_to: cmp01
  become: true
  ansible.builtin.slurp:
    src: /opt/homelab/jellyfin/jellyseerr/settings.json
  register: _jseerr_cfg
  no_log: true

- name: Set fetched keys
  ansible.builtin.set_fact:
    hp_bazarr_key: "{{ (_bazarr_cfg.content | b64decode | regex_findall('apikey: *([0-9a-f]+)') | first) | default('') }}"
    hp_nzb_user: "{{ (_nzb_cfg.content | b64decode | regex_findall('ControlUsername=(.*)') | first | trim) | default('') }}"
    hp_nzb_pass: "{{ (_nzb_cfg.content | b64decode | regex_findall('ControlPassword=(.*)') | first | trim) | default('') }}"
    hp_jseerr_key: "{{ (_jseerr_cfg.content | b64decode | from_json).main.apiKey }}"
  no_log: true

# --- Jellyfin API key (mint 'homepage' if missing) ---
- name: Jellyfin admin auth
  delegate_to: cmp01
  ansible.builtin.uri:
    url: "http://localhost:8096/Users/AuthenticateByName"
    method: POST
    headers: { Authorization: 'MediaBrowser Client="hp", Device="hp", DeviceId="hp", Version="1"' }
    body_format: json
    body: { Username: "admin", Pw: "{{ vault_jellyfin_admin_password }}" }
  register: _jf_auth
  no_log: true
  failed_when: false

- name: Jellyfin - list existing API keys
  delegate_to: cmp01
  ansible.builtin.uri:
    url: "http://localhost:8096/Auth/Keys"
    headers: { Authorization: 'MediaBrowser Token="{{ _jf_auth.json.AccessToken }}"' }
  register: _jf_keys
  when: _jf_auth.json.AccessToken is defined
  failed_when: false
  no_log: true

- name: Jellyfin - create 'homepage' key if missing
  delegate_to: cmp01
  ansible.builtin.uri:
    url: "http://localhost:8096/Auth/Keys?App=homepage"
    method: POST
    headers: { Authorization: 'MediaBrowser Token="{{ _jf_auth.json.AccessToken }}"' }
    status_code: [200, 204]
  when:
    - _jf_auth.json.AccessToken is defined
    - (_jf_keys.json.Items | default([]) | selectattr('AppName','equalto','homepage') | list | length) == 0
  failed_when: false
  no_log: true

- name: Jellyfin - re-read keys
  delegate_to: cmp01
  ansible.builtin.uri:
    url: "http://localhost:8096/Auth/Keys"
    headers: { Authorization: 'MediaBrowser Token="{{ _jf_auth.json.AccessToken }}"' }
  register: _jf_keys2
  when: _jf_auth.json.AccessToken is defined
  failed_when: false
  no_log: true

- name: Set jellyfin key fact
  ansible.builtin.set_fact:
    hp_jellyfin_key: "{{ (_jf_keys2.json.Items | selectattr('AppName','equalto','homepage') | map(attribute='AccessToken') | first) | default('') }}"
  no_log: true
  when: _jf_auth.json.AccessToken is defined

- name: Default jellyfin key empty if auth failed
  ansible.builtin.set_fact:
    hp_jellyfin_key: "{{ hp_jellyfin_key | default('') }}"

# --- Portainer access token (minted ONCE, then reused) --------------------
# This block used to mint a fresh token on every run. Portainer only returns
# rawAPIKey at creation, so a fresh mint meant a different value in
# services.yaml every time, which meant the template always reported "changed"
# and Homepage restarted on every single site.yml run — for no reason.
#
# So the raw key is now persisted next to the service, in the same
# generate-once-and-read-back idiom as Open WebUI's secret key and Gitea's
# admin password (never the vault: re-running the role must not rotate a
# credential something else already holds). A new token is minted only when
# the cache is missing or Portainer no longer has a matching token — so a
# revoked or hand-deleted token still self-heals on the next run.
- name: Portainer - check for a cached access token
  become: true
  ansible.builtin.stat:
    path: "{{ homepage_portainer_token_file }}"
  register: _pt_cache

- name: Portainer - read the cached access token
  become: true
  ansible.builtin.slurp:
    src: "{{ homepage_portainer_token_file }}"
  register: _pt_cached_raw
  when: _pt_cache.stat.exists
  no_log: true

- name: Portainer auth
  ansible.builtin.uri:
    url: "http://localhost:9001/api/auth"
    method: POST
    body_format: json
    body: { Username: "admin", Password: "{{ vault_portainer_admin_password }}" }
  register: _pt_login
  no_log: true
  failed_when: false

- name: Portainer - list existing tokens
  ansible.builtin.uri:
    url: "http://localhost:9001/api/users/1/tokens"
    headers: { Authorization: "Bearer {{ _pt_login.json.jwt }}" }
  register: _pt_tokens
  when: _pt_login.json.jwt is defined
  failed_when: false
  no_log: true

# Reuse only if we hold a raw key AND Portainer still lists a token by that
# description. Either half missing means the cache is worthless.
- name: Portainer - decide whether the cached token is still usable
  ansible.builtin.set_fact:
    _pt_reuse: >-
      {{ (_pt_cache.stat.exists | default(false))
         and ((_pt_cached_raw.content | default('') | b64decode | trim) | length > 0)
         and ((_pt_tokens.json | default([])
               | selectattr('description', 'equalto', 'homepage-dash')
               | list | length) > 0) }}
  no_log: true

- name: Portainer - delete old homepage-dash tokens
  ansible.builtin.uri:
    url: "http://localhost:9001/api/users/1/tokens/{{ item.id }}"
    method: DELETE
    headers: { Authorization: "Bearer {{ _pt_login.json.jwt }}" }
    status_code: [204, 200]
  loop: "{{ _pt_tokens.json | default([]) | selectattr('description','equalto','homepage-dash') | list }}"
  loop_control: { label: "{{ item.id }}" }
  when: _pt_login.json.jwt is defined and not _pt_reuse
  no_log: true

- name: Portainer - create homepage-dash token
  ansible.builtin.uri:
    url: "http://localhost:9001/api/users/1/tokens"
    method: POST
    headers: { Authorization: "Bearer {{ _pt_login.json.jwt }}" }
    body_format: json
    body: { description: "homepage-dash", password: "{{ vault_portainer_admin_password }}" }
    status_code: [200, 201]
  register: _pt_new
  when: _pt_login.json.jwt is defined and not _pt_reuse
  no_log: true

- name: Portainer - persist the newly minted token
  become: true
  ansible.builtin.copy:
    content: "{{ _pt_new.json.rawAPIKey }}\n"
    dest: "{{ homepage_portainer_token_file }}"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0600"
  when: not _pt_reuse and (_pt_new.json.rawAPIKey is defined)
  no_log: true

- name: Set portainer facts
  ansible.builtin.set_fact:
    hp_portainer_token: >-
      {{ (_pt_cached_raw.content | b64decode | trim) if _pt_reuse
         else (_pt_new.json.rawAPIKey | default('')) }}
    hp_portainer_env: 1
  no_log: true

# --- Paperless DRF token (superuser uknth) ---
- name: Paperless - mint DRF token for uknth
  delegate_to: cmp01
  become: true
  ansible.builtin.command: docker exec paperless python manage.py drf_create_token uknth
  register: _pl_tok
  changed_when: false
  failed_when: false
  no_log: true

- name: Set paperless key fact
  ansible.builtin.set_fact:
    hp_paperless_key: "{{ (_pl_tok.stdout | regex_findall('Generated token (\\w+)') | first) | default('') }}"
  no_log: true
