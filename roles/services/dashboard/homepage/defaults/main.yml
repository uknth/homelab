---
# services/dashboard/homepage — gethomepage/homepage on util01 (dash.puhome.net).
# Replaces Glance. Service links + info widgets + Docker (util01) integration.
# Live per-app widgets (arr/jellyfin/paperless) need API keys — add later.
homepage_image: "ghcr.io/gethomepage/homepage:latest"
homepage_root_dir: "{{ service_root }}/homepage"
homepage_port: 8094
homepage_allowed_hosts: "dash.{{ base_domain }}"

# Hosts the widgets talk to (direct app ports, not the reverse proxy).
homepage_media_host: "cmp01.host.puhome.net"
homepage_util_host: "util01.host.puhome.net"
homepage_truenas_url: "https://{{ hostvars['nas01'].ansible_host }}"
homepage_authentik_url: "http://{{ hostvars['util01'].ansible_host }}:9000"
# Weather (Open-Meteo, no key). Default Bengaluru; change lat/long as needed.
homepage_weather_label: "Bengaluru"
homepage_weather_lat: 12.9716
homepage_weather_long: 77.5946

# Look & feel
homepage_theme: "light"
homepage_color: "slate"
homepage_greeting: "Welcome home, Ujjwal"

# Widget auth for apps with no gathered API key. Best-guess admin usernames —
# override here if your admin account differs. Navidrome uses Subsonic token auth
# (token = md5(password + salt)).
homepage_navidrome_user: "uknth"
homepage_navidrome_salt: "homepagewidget"

# --- Nodes tab -------------------------------------------------------------
# Container inventory per Docker node. The node list comes from the Portainer
# API (/api/endpoints) and the container list from the Docker API through it —
# nothing here enumerates services by hand.
#
# Portainer names its own local socket environment "primary"; map it to the host
# it actually runs on. Extend this if other environments get opaque names.
homepage_node_name_map:
  primary: util01
# Only running containers are listed (the Docker API returns those by default).
# Append '?all=1' to the widget URL in services.yaml.j2 to include stopped ones.
homepage_nodes_refresh: 30000 # ms between refreshes
homepage_nodes_limit: 60 # max rows per node, guards against a runaway list
