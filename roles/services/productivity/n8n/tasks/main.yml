---
- name: Create n8n dirs
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0755"
  loop:
    - "{{ n8n_root_dir }}"
    - "{{ n8n_root_dir }}/compose"
    - "{{ n8n_root_dir }}/data"
- name: Fix n8n data dir ownership (container runs as uid 1000 'node')
  become: true
  ansible.builtin.file:
    path: "{{ n8n_root_dir }}/data"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
- name: Template n8n env + compose
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ n8n_root_dir }}/compose/{{ item.dest }}"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0640"
  loop:
    - { src: env.j2, dest: .env }
    - { src: docker-compose.yml.j2, dest: docker-compose.yml }
  no_log: true
  notify: Restart n8n
- name: Deploy n8n
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ n8n_root_dir }}/compose"
    project_name: "n8n"
    state: present
    pull: missing

# --- Workflows -------------------------------------------------------------
# Defined as JSON in this role and imported with the n8n CLI, so they live in
# git rather than only inside n8n's database. Re-importing the same ids is
# idempotent — it overwrites in place.
#
# Three independent credential/workflow sets, each gated on its key existing so a
# partial fleet run still imports what it can:
#   maintenance (util01) — ops/maintenance installs the key
#   wanwatch    (gw01)   — ops/wanwatch installs the key
#   vaultsync   (cmp01)  — services/knowledge/vaultsync installs the key
#                          (also reused as-is by workflow-agent-research —
#                          same forced-command key on cmp01, no second key)

- name: Read the restricted maintenance SSH key
  become: true
  ansible.builtin.slurp:
    src: "{{ n8n_maint_key_path }}"
  register: _n8n_maint_key
  failed_when: false
  check_mode: false
  no_log: true

- name: Read the restricted wanwatch SSH key
  become: true
  ansible.builtin.slurp:
    src: "{{ n8n_wan_key_path }}"
  register: _n8n_wan_key
  failed_when: false
  check_mode: false
  no_log: true

- name: Read the restricted vaultsync SSH key
  become: true
  ansible.builtin.slurp:
    src: "{{ n8n_vault_key_path }}"
  register: _n8n_vault_key
  failed_when: false
  check_mode: false
  no_log: true

- name: Note whether the Telegram bridge is configured
  ansible.builtin.set_fact:
    _n8n_telegram_ok: "{{ (n8n_telegram_bot_token | length > 0) and (n8n_telegram_chat_id | length > 0) }}"

- name: Work out which workflow sets can be imported
  ansible.builtin.set_fact:
    _n8n_credentials: >-
      {{ (['credential-maint-ssh.json'] if _n8n_maint_key.content is defined else [])
       + (['credential-wan-ssh.json'] if _n8n_wan_key.content is defined else [])
       + (['credential-vault-ssh.json'] if _n8n_vault_key.content is defined else [])
       + (['credential-telegram.json'] if _n8n_telegram_ok else []) }}
    # alerts-summary talks only to ntfy over HTTP, so it needs no credential and
    # imports unconditionally.
    _n8n_workflows: >-
      {{ ['workflow-alerts-summary.json']
       + (['workflow-diun-update.json', 'workflow-weekly-maintenance.json']
          if _n8n_maint_key.content is defined else [])
       + (['workflow-wan-watch.json'] if _n8n_wan_key.content is defined else [])
       + (['workflow-vault-ingest.json'] if _n8n_vault_key.content is defined else [])
       + (['workflow-agent-research.json'] if _n8n_vault_key.content is defined else [])
       + (['workflow-telegram-bridge.json'] if _n8n_telegram_ok else []) }}
    _n8n_workflow_ids: >-
      {{ ['homelab-alerts-summary']
       + (['homelab-diun-update', 'homelab-weekly-maintenance']
          if _n8n_maint_key.content is defined else [])
       + (['homelab-wan-watch'] if _n8n_wan_key.content is defined else [])
       + (['homelab-vault-ingest'] if _n8n_vault_key.content is defined else [])
       + (['homelab-agent-research'] if _n8n_vault_key.content is defined else [])
       + (['homelab-telegram-bridge'] if _n8n_telegram_ok else []) }}

- name: Import workflows into n8n
  when: _n8n_workflows | length > 0
  block:
    - name: Create n8n import dir
      become: true
      ansible.builtin.file:
        path: "{{ n8n_root_dir }}/data/import"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0700"

    - name: Template credentials + workflows
      become: true
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ n8n_root_dir }}/data/import/{{ item }}"
        owner: "1000"
        group: "1000"
        mode: "0600"
      loop: "{{ _n8n_credentials + _n8n_workflows }}"
      vars:
        n8n_maint_private_key: "{{ _n8n_maint_key.content | default('') | b64decode }}"
        n8n_wan_private_key: "{{ _n8n_wan_key.content | default('') | b64decode }}"
        n8n_vault_private_key: "{{ _n8n_vault_key.content | default('') | b64decode }}"
      no_log: true

    - name: Import the SSH credentials
      become: true
      ansible.builtin.command:
        cmd: >-
          docker exec n8n n8n import:credentials
          --input=/home/node/.n8n/import/{{ item }}
      loop: "{{ _n8n_credentials }}"
      register: _n8n_cred_import
      changed_when: "'Successfully imported' in _n8n_cred_import.stdout"

    # --activeState=fromJson only works in queue/multi-main mode; this n8n runs
    # in regular mode, so import first and publish separately.
    - name: Import the workflows
      become: true
      ansible.builtin.command:
        cmd: >-
          docker exec n8n n8n import:workflow
          --input=/home/node/.n8n/import/{{ item }}
      loop: "{{ _n8n_workflows }}"
      register: _n8n_wf_import
      changed_when: "'Successfully imported' in _n8n_wf_import.stdout"

    - name: Publish (activate) the workflows
      become: true
      ansible.builtin.command:
        cmd: docker exec n8n n8n publish:workflow --id={{ item }}
      loop: "{{ _n8n_workflow_ids }}"
      register: _n8n_wf_publish
      changed_when: _n8n_wf_publish.rc == 0

    # The credential files hold private keys in plaintext — n8n has now
    # encrypted them into its own store, so they must not linger.
    - name: Remove the plaintext credential files
      become: true
      ansible.builtin.file:
        path: "{{ n8n_root_dir }}/data/import/{{ item }}"
        state: absent
      loop: "{{ _n8n_credentials }}"

    - name: Restart n8n so the webhooks and schedules register
      become: true
      community.docker.docker_compose_v2:
        project_src: "{{ n8n_root_dir }}/compose"
        project_name: "n8n"
        state: restarted
      when: _n8n_wf_import is changed
