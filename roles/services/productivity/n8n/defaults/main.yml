---
n8n_image: "n8nio/n8n:latest"
n8n_root_dir: "{{ service_root }}/n8n"
n8n_port: 5678
n8n_host: "n8n.{{ base_domain }}"
n8n_encryption_key: "{{ vault_n8n_encryption_key }}"

# --- Maintenance automation -------------------------------------------------
# n8n owns the schedule and the Diun-triggered upgrades. Both workflows are
# defined as JSON in this role and imported with the n8n CLI, so they live in
# git rather than only in n8n's database.
n8n_ntfy_url: "http://{{ hostvars['util01'].ansible_host }}:{{ ntfy_port | default(8091) }}"
n8n_jobs_ntfy_topic: "homelab-jobs"   # every n8n job reports here, pass or fail
n8n_maintenance_weekday: 0            # 0 = Sunday
n8n_maintenance_hour: 4               # 04:00, after the nightly restic run
# Restricted key installed by ops/maintenance (forced command, that script only).
n8n_maint_key_path: "{{ service_root }}/maintenance/n8n_maint_ed25519"

# --- Dual-WAN watch ---------------------------------------------------------
# The probe itself lives on gw01 (ops/wanwatch) behind its own forced-command
# key; n8n owns the schedule and republishes the last result at
# /webhook/wan-status for the Homepage widget.
#
# Per-WAN alerting is Uptime Kuma's job — the probe pushes each link's verdict
# straight to a push monitor, and Kuma's default ntfy channel fires from there.
# This workflow therefore only pages when the probe itself cannot run, so a
# dead ISP produces one notification rather than two.
n8n_wan_key_path: "{{ service_root }}/wanwatch/n8n_wan_ed25519"
n8n_wan_interval_minutes: 2

# --- vault ingest (cmp01) ---------------------------------------------------
# Obsidian Sync -> mirror -> (index) -> Quartz wiki. Hourly rather than
# continuous: the wiki is a periodic publish, and every stage is incremental, so
# a quiet hour costs one SSH round-trip and no GPU work. See
# docs/spec/knowledge.md.
n8n_vault_key_path: "{{ service_root }}/vaultsync/n8n_vault_ed25519"
n8n_vault_interval_hours: 1

# --- agent research trigger (ctl01 -> cmp01 -> wiki) ------------------------
# n8n is the trigger, never the transformer, here too: researchd cannot reach
# util01 or cmp01 (egress allowlist — see docs/spec/research.md), so a job
# reaching `ready` has to be discovered by polling rather than pushed. This
# workflow polls researchd's job list, drives cmp01's --research <job_id>
# ingest over the SAME forced-command key/credential vault ingest already
# uses (homelab-vault-ssh / n8n_vault_key_path — no separate key), and calls
# back to researchd's own /published endpoint once the wiki rebuild succeeds.
#
# researchd runs on ctl01, a SEPARATE playbook from util01's — its role
# defaults (roles/services/ai/researchd/defaults/main.yml) are never loaded
# into this play, so the address is a literal fact of the deployment rather
# than a cross-role lookup (same reasoning as researchpull_api_url). See
# docs/spec/research.md#ports-and-domains.
n8n_research_api_url: "http://{{ hostvars['ctl01'].ansible_host }}:8110"
# 1 minute, not 5: "research started" notifications need to be timely, and
# this is only safe because the workflow tracks in-flight job ids in static
# data and skips any job whose ~20-minute ingest is already running (see
# 'Skip in-flight jobs' in workflow-agent-research.json.j2). Raising this
# again later without keeping that guard would re-introduce concurrent
# duplicate ingests of the same job.
n8n_research_poll_minutes: 1

# --- ntfy alert summary -----------------------------------------------------
# ntfy answers history as NDJSON, which Homepage's customapi widget cannot
# parse, so n8n aggregates it into one JSON object at /webhook/alerts-summary.
# The window is capped by ntfy's own cache-duration (12h in services/monitoring/
# ntfy) -- asking for longer silently under-reports rather than erroring.
n8n_alert_topics:
  - "homelab-alerts"    # Uptime Kuma monitor failures
  - "homelab-updates"   # Diun image updates + maintenance runs
  - "homelab-jobs"      # every n8n job, pass or fail
n8n_alerts_window: "12h"

# --- Telegram bridge --------------------------------------------------------
# Phone delivery. The ntfy iOS app never received a push here despite the
# server side being verified end to end (see docs/runbooks/notifications.md),
# and even a plain ntfy.sh topic failed on a freshly installed app -- so the
# last hop moved to Telegram, which has its own working push.
#
# ntfy stays the single bus: every service still posts there, the dashboard
# still reads it, and the ntfy-relay sidecar forwards to /webhook/ntfy-relay.
# Only this last hop changed, so swapping transport again later means editing
# one workflow rather than five roles.
#
# Both must be set for the bridge to import; empty leaves it out entirely.
n8n_telegram_bot_token: "{{ vault_telegram_bot_token | default('') }}"
n8n_telegram_chat_id: "{{ vault_telegram_chat_id | default('') }}"
