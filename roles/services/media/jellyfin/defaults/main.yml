---
# services/media/jellyfin — media server (GPU/NVENC) + Jellyseerr (requests).
# NOT behind Authentik forward-auth: native clients (TV/mobile) can't do
# interactive SSO, so Jellyfin uses its own auth (OIDC plugin = later, tier 3).

jellyfin_root_dir: "{{ service_root }}/jellyfin"
jellyfin_data_dir: "{{ media_data_dir }}"      # /mnt/media/data
jellyfin_puid: "{{ media_uid }}"
jellyfin_pgid: "{{ media_gid }}"
jellyfin_port: 8096
jellyseerr_port: 5055
jellyfin_published_url: "https://video.{{ base_domain }}"

# Wizard admin (manual-login form, NOT the Authentik button) — see
# docs/spec/auth.md. Used only to promote SSO users to admin in tasks/main.yml.
jellyfin_admin_user: "admin"
jellyfin_admin_password: "{{ vault_jellyfin_admin_password | default('') }}"

# Jellyfin usernames that should hold the admin role. Authentik SSO users land
# as non-admin, so without this a rebuild silently demotes them.
jellyfin_sso_admin_users: ["uknth"]

