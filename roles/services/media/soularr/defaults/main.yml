---
# services/media/soularr — bridges Lidarr's "wanted" list to slskd (Soulseek):
# searches, downloads, and imports back to Lidarr. Runs on a loop (SCRIPT_INTERVAL).
soularr_image: "mrusse08/soularr:latest"
soularr_root_dir: "{{ service_root }}/soularr"
soularr_webui_port: 8265
soularr_interval: 300              # seconds between runs
soularr_puid: "{{ media_uid }}"
soularr_pgid: "{{ media_gid }}"
soularr_download_dir: "/data/downloads/soulseek"   # shared view (Lidarr + slskd + soularr)

# Lidarr has no Docker DNS alias on the arr network any more: the whole arr
# stack shares gluetun's netns (see roles/services/media/arr), so gluetun is
# now the container that holds the address and publishes 8686. soularr itself
# is still on the arr bridge network, not in that netns, so it must dial
# gluetun here — not localhost, which would only work for a container that is
# actually inside the shared netns.
soularr_lidarr_url: "http://gluetun:8686"
