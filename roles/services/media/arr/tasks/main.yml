---
# Deploy the arr stack on cmp01. Requires the /mnt/media/data NFS mount (phase 3).

- name: Assert media mount is present
  ansible.builtin.command: "findmnt --target {{ arr_data_dir }}"
  changed_when: false

- name: Create arr config directories
  become: true
  ansible.builtin.file:
    path: "{{ arr_root_dir }}/{{ item }}"
    state: directory
    owner: "{{ arr_puid }}"
    group: "{{ arr_pgid }}"
    mode: "0755"
  loop:
    - ""
    - compose
    - gluetun
    - qbittorrent
    - nzbget
    - prowlarr
    - sonarr
    - radarr
    - lidarr
    - bazarr

- name: Template arr compose + env
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ arr_root_dir }}/compose/{{ item.dest }}"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0640"
  loop:
    - { src: docker-compose.yml.j2, dest: docker-compose.yml }
    - { src: env.j2, dest: .env }
  no_log: true
  notify: Restart arr

- name: Deploy arr stack
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ arr_root_dir }}/compose"
    project_name: arr
    state: present
    pull: missing

- name: Enforce download-client config (paths + qbit auth)
  ansible.builtin.import_tasks: download_config.yml
