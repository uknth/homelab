---
# services/network/blocky — local DNS for the homelab (Docker container on gw01).
#
# Role split (see docs/spec/architecture.md#dns-design):
#   * Blocky answers LOCAL names (*.puhome.net) and forwards everything else.
#   * Blocking is OFF here — Pi-hole (dns01) is the ad/tracker blocker.
#   * Upstreams are strict-ordered: Pi-hole first (so blocking still happens),
#     then a DoH fallback so a dead Pi Zero degrades to "ads return", not
#     "no internet".

blocky_image: "spx01/blocky:v0.26.2"
blocky_root_dir: "{{ service_root }}/blocky"    # /opt/homelab/blocky
blocky_dns_port: 53
blocky_http_port: 4000
blocky_ui_ext_port: 14012

# Where all *.puhome.net service names resolve to (the nginx reverse proxy).
blocky_reverse_proxy_ip: "10.0.2.2"

# Strict-ordered upstreams: Pi-hole (blocking) then DoH fallback.
blocky_upstreams:
  - "10.0.2.7"                              # Pi-hole @ dns01 — does the blocking
  - "https://dns.quad9.net/dns-query"       # DoH fallback if Pi-hole is down

# Extra static name→IP mappings beyond the inventory-derived host records.
blocky_extra_mappings:
  dns01.host.puhome.net: "10.0.2.7"
  router.host.puhome.net: "10.0.2.1"
  # Gitea's SSH listener. `git.puhome.net` resolves to the reverse proxy and
  # serves the web UI and git-over-HTTPS; SSH cannot go through it, because
  # nginx here proxies HTTP only. This points at the ssh-redirect sidecar's
  # OWN macvlan IP (roles/services/development/gitea, gitea_ssh_ip) rather
  # than at cmp01 (10.0.2.5) itself — cmp01's own sshd already owns
  # 0.0.0.0:22, so the portless clone URL
  # (`git@ssh.git.puhome.net:uknth/homelab.git`, no port suffix) has to land
  # on a DIFFERENT address that has its own, unrelated port 22. Named
  # `ssh.git.*` rather than `git.host.*` so it reads as "the SSH layer of
  # git.puhome.net" rather than as an unrelated host record.
  ssh.git.puhome.net: "10.0.2.18"

# Pin specific hostnames to a working IP (workaround for broken anycast edges).
# GitHub's CDN (*.githubusercontent.com) round-robins 185.199.108-111.133;
# .109.133 is blackholed via our WAN, so .NET single-shot downloads (Jellyfin
# plugins, Kavita migrations) time out. Pin to a known-good edge.
blocky_pinned_hosts:
  githubusercontent.com: "185.199.110.133"
