---
# Pi-hole on dns01: conditional-forward drop-in, then settings, then list content.

- name: Ensure dnsmasq.d exists
  become: true
  ansible.builtin.file:
    path: /etc/dnsmasq.d
    state: directory
    mode: "0755"

- name: Install conditional-forward drop-in (puhome.net -> Blocky)
  become: true
  ansible.builtin.template:
    src: 02-puhome-forward.conf.j2
    dest: "{{ pihole_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart pihole DNS

- name: Manage Pi-hole settings (setupVars, FTL conf, stale drop-ins)
  ansible.builtin.include_tasks: config.yml

- name: Manage Pi-hole lists (gravity.db)
  ansible.builtin.include_tasks: lists.yml
  when: pihole_manage_lists | bool

# Apply regenerate/restart/gravity handlers now so the validation below tests
# the config FTL will actually run with.
- name: Apply pending Pi-hole handlers
  ansible.builtin.meta: flush_handlers

- name: Validate dnsmasq config
  become: true
  ansible.builtin.command: pihole-FTL dnsmasq-test
  changed_when: false
