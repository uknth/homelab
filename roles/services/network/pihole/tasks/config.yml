---
# setupVars.conf: one lineinfile per owned key. The file also holds WEBPASSWORD,
# so it is never templated whole and WEBPASSWORD is never referenced here.
# Changing a key regenerates /etc/dnsmasq.d/01-pihole.conf (generated by
# Pi-hole, never edited directly) via the "Regenerate pihole DNS config" handler.
- name: Set owned setupVars.conf keys
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pihole/setupVars.conf
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop: "{{ pihole_setupvars | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Regenerate pihole DNS config

# Read by FTL at start only; the restart handler picks up a change.
- name: Install pihole-FTL.conf
  become: true
  ansible.builtin.template:
    src: pihole-FTL.conf.j2
    dest: /etc/pihole/pihole-FTL.conf
    owner: pihole
    group: root
    mode: "0664"
  notify: Restart pihole DNS

# Temporary incident drop-in (extra root-key trust anchor); moot with DNSSEC off.
- name: Remove manual root-KSK trust-anchor drop-in
  become: true
  ansible.builtin.file:
    path: /etc/dnsmasq.d/07-root-ksk-2024.conf
    state: absent
  notify: Restart pihole DNS
