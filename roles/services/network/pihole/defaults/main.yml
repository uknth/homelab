  - { address: "https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt", enabled: true, comment: "" }
  - { address: "https://adaway.org/hosts.txt", enabled: true, comment: "" }
  - { address: "https://v.firebog.net/hosts/AdguardDNS.txt", enabled: true, comment: "" }
  - { address: "https://v.firebog.net/hosts/Admiral.txt", enabled: true, comment: "" }
  - { address: "https://s3.amazonaws.com/lists.disconnect.me/simple_malvertising.txt", enabled: true, comment: "" }
  - { address: "https://s3.amazonaws.com/lists.disconnect.me/simple_ad.txt", enabled: true, comment: "" }
  - { address: "https://v.firebog.net/hosts/Easylist.txt", enabled: true, comment: "" }
  - { address: "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext", enabled: true, comment: "" }
  - { address: "https://raw.githubusercontent.com/FadeMind/hosts.extras/master/UncheckyAds/hosts", enabled: true, comment: "" }
  - { address: "https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts", enabled: true, comment: "" }
  - { address: "https://v.firebog.net/hosts/Easyprivacy.txt", enabled: true, comment: "" }
  - { address: "https://v.firebog.net/hosts/Prigent-Ads.txt", enabled: true, comment: "" }
  - { address: "https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.2o7Net/hosts", enabled: true, comment: "" }
  - { address: "https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt", enabled: true, comment: "" }
  - { address: "https://hostfiles.frogeye.fr/firstparty-trackers-hosts.txt", enabled: true, comment: "" }
  - { address: "https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt", enabled: true, comment: "" }
  - { address: "https://osint.digitalside.it/Threat-Intel/lists/latestdomains.txt", enabled: true, comment: "" }
  - { address: "https://v.firebog.net/hosts/Prigent-Crypto.txt", enabled: true, comment: "" }
  - { address: "https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Risk/hosts", enabled: true, comment: "" }
  - { address: "https://bitbucket.org/ethanr/dns-blacklists/raw/8575c9f96e5b4a1308f2f12394abd86d0927a4a0/bad_lists/Mandiant_APT1_Report_Appendix_D.txt", enabled: true, comment: "" }
  - { address: "https://phishing.army/download/phishing_army_blocklist_extended.txt", enabled: true, comment: "" }
  - { address: "https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-malware.txt", enabled: true, comment: "" }
  - { address: "https://v.firebog.net/hosts/RPiList-Malware.txt", enabled: true, comment: "" }
  - { address: "https://v.firebog.net/hosts/RPiList-Phishing.txt", enabled: true, comment: "" }
