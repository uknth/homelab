  - { address: "https://v.firebog.net/hosts/static/w3kbl.txt", enabled: true, comment: "" }
  - { address: "https://blocklistproject.github.io/Lists/ads.txt", enabled: true, comment: "" }
  - { address: "https://blocklistproject.github.io/Lists/fraud.txt", enabled: true, comment: "" }
