---
# services/network/pihole — configures the (already-installed) Pi-hole v5 on dns01.
# Pi-hole itself is installed by the official installer, NOT by Ansible, and
# WEBPASSWORD in setupVars.conf is never touched (see docs/runbooks/dns01-pihole.md).
#
# Two jobs:
#   1. conditionally forward the whole local zone to Blocky, so every
#      *.puhome.net name resolves via the secondary resolver too — set once,
#      works for every service ever launched (no per-app changes).
#   2. own Pi-hole's settings (setupVars keys, FTL conf) and its adlist /
#      allowlist / regex-denylist content (gravity.db) declaratively.

# Forward the base domain to Blocky (derived from gw01's inventory IP).
pihole_forward_domain: "{{ base_domain }}"
pihole_forward_target: "{{ hostvars['gw01'].ansible_host }}"
pihole_dropin_path: /etc/dnsmasq.d/02-puhome-forward.conf

# Keys of /etc/pihole/setupVars.conf this role owns, applied one lineinfile per
# key. Values are strings (setupVars is shell-sourced). Any key NOT listed here
# (WEBPASSWORD, TEMPERATUREUNIT, ...) is left alone. Removing an upstream
# (PIHOLE_DNS_n) here does not delete the stale line on the host.
pihole_setupvars:
  PIHOLE_INTERFACE: eth0
  IPV4_ADDRESS: 10.0.2.7/24
  DNSMASQ_LISTENING: single
  QUERY_LOGGING: "false"
  BLOCKING_ENABLED: "true"
  DNS_FQDN_REQUIRED: "true"
  DNS_BOGUS_PRIV: "true"
  # Off: the Oct 2026 root-KSK rollover broke local validation; the upstream
  # resolvers (Google/Cloudflare) validate anyway.
  DNSSEC: "false"
  PIHOLE_DNS_1: 8.8.8.8
  PIHOLE_DNS_2: 2001:4860:4860:0:0:0:0:8888
  PIHOLE_DNS_3: 1.1.1.1
  PIHOLE_DNS_4: 1.0.0.1
  PIHOLE_DNS_5: 2606:4700:4700::1111

# /etc/pihole/pihole-FTL.conf, rendered whole (it holds no secrets).
pihole_ftl_conf:
  # Days of query history kept in pihole-FTL.db (does not shrink the file).
  MAXDBDAYS: 30
  PRIVACYLEVEL: 0
  RATE_LIMIT: 9000/60

# Master switch for the gravity.db sync below. The sync is DECLARATIVE: rows of
# the managed kinds that are not listed here are deleted. Set false to manage
# lists by hand again.
pihole_manage_lists: true

# Adlists (gravity.db `adlist`), captured verbatim from dns01 on 2026-10-13.
pihole_adlists:
