  - { address: "https://blocklistproject.github.io/Lists/tracking.txt", enabled: true, comment: "" }

# Exact allowlist (domainlist type 0). Shared with Blocky's allowlist.
pihole_allowlist: "{{ dns_allowlist }}"

# Regex allowlist (domainlist type 2). NOTE: the two regexes captured from dns01
# are stored as type 2 (regex ALLOW), not type 3 (regex deny) as first assumed.
pihole_regex_allowlist:
  - '(\.|^)clickhouse\.com$'
  - '(\.|^)webengage\.com$'

# Regex denylist (domainlist type 3). dns01 has none today; because the sync is
# declarative, anything added by hand to type 3 will be removed.
pihole_regex_denylist: []

# Paths / binary. sqlite3 is not installed on dns01; Pi-hole's own FTL binary
# embeds the sqlite3 shell, so no extra package is needed.
pihole_gravity_db: /etc/pihole/gravity.db
pihole_sqlite: [pihole-FTL, sqlite3, -cmd, ".timeout 60000"]
