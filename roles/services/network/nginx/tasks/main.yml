---
# Native nginx reverse proxy for all *.puhome.net, TLS via the wildcard cert.

- name: Install nginx
  become: true
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Install shared snippets
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/nginx/snippets/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ssl-params.conf
    - authentik-forward-auth.conf
    - authentik-auth-request.conf
  notify: Reload nginx

- name: Remove stock default site
  become: true
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Install default (deny-unknown) server
  become: true
  ansible.builtin.template:
    src: default-server.conf.j2
    dest: /etc/nginx/sites-available/000-default.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Validate nginx_sites entries are unambiguous (upstream xor redirect_to)
  ansible.builtin.assert:
    that:
      - (item.upstream is defined) != (item.redirect_to is defined)
    fail_msg: >-
      nginx_sites entry "{{ item.name }}" must set exactly one of
      upstream or redirect_to, not both and not neither.
    quiet: true
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"

- name: Template per-service vhosts
  become: true
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload nginx

# force matters ONLY under --check, and is deliberately conditional rather
# than a flat true. The template task above is a no-op in check mode, so a
# vhost being added for the FIRST time has no source file on the target yet
# and this task dies with "src file does not exist" — a check-mode artifact,
# not a real failure (a live run templates the file immediately before this).
# Left unhandled it makes .gitea/workflows/pr-dryrun.yml go red on every PR
# that introduces a vhost, which is a change we make often; it first bit the
# `search` site on PR #1. Flat `force: true` would fix that too, but it would
# also silently create dangling symlinks in REAL runs when a site is listed
# in nginx_sites with no template behind it — exactly the mistake this task
# failing is useful for catching. Tying it to ansible_check_mode keeps the
# real-run guard intact and suppresses only the false positive.
- name: Enable configured sites (symlink)
  become: true
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item }}.conf"
    state: link
    force: "{{ ansible_check_mode }}"
  loop: "{{ ['000-default'] + (nginx_sites | map(attribute='name') | list) }}"
  notify: Reload nginx

- name: Prune sites-enabled entries no longer in nginx_sites
  become: true
  ansible.builtin.shell: >-
    for f in /etc/nginx/sites-enabled/*.conf; do
      b=$(basename "$f" .conf);
      case " {{ (['000-default'] + (nginx_sites | map(attribute='name') | list)) | join(' ') }} " in
        *" $b "*) : ;;
        *) rm -f "$f" ;;
      esac
    done
  args:
    executable: /bin/bash
  changed_when: false

- name: Validate nginx configuration
  become: true
  ansible.builtin.command: nginx -t
  changed_when: false
