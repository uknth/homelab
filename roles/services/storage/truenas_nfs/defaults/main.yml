---
# services/storage/truenas_nfs — manage NFS exports on nas01 via the TrueNAS
# REST API (idempotent: create-if-missing, update-if-drifted). Runs from the
# control node (connection: local) against https://<nas01>/api/v2.0.
#
# nas01 stays otherwise unmanaged — this only manages export definitions so
# they're reproducible IaC. It does NOT create datasets (they already exist).

truenas_api_base: "https://{{ ansible_host }}/api/v2.0"
truenas_api_key: "{{ vault_truenas_api_key }}"

# Desired NFS exports. Managed fields: hosts (allowed clients), ro, enabled.
truenas_nfs_exports:
  - path: "{{ media_nfs_export }}"          # /mnt/data-pool/media/data
    hosts: ["{{ hostvars['cmp01'].ansible_host }}"]   # restrict to cmp01
    ro: false
    enabled: true
    comment: "media handoff — managed by Ansible (v3)"

  # Gitea's repositories. On RAIDZ2 rather than cmp01's local disk because this
  # is the one artefact on the fleet with no upstream to re-pull from; the
  # SQLite database deliberately stays LOCAL to cmp01, since NFS implements
  # POSIX locking incompletely and the failure mode is silent corruption
  # (see roles/services/development/gitea/defaults/main.yml).
  #
  # PREREQUISITE: the dataset `data-pool/gitea` must exist before this share
  # can be created. This role manages export DEFINITIONS only, never datasets —
  # the same boundary every other export here sits behind. Create it once in
  # the TrueNAS UI (Datasets -> data-pool -> Add Dataset -> "gitea"), then this
  # becomes ordinary IaC.
  - path: "{{ gitea_nfs_export }}"         # /mnt/data-pool/gitea
    hosts: ["{{ hostvars['cmp01'].ansible_host }}"]   # restrict to cmp01
    ro: false
    enabled: true
    comment: "gitea repositories — managed by Ansible (v3)"
