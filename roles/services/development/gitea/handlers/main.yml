---
- name: Restart gitea
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ gitea_compose_dir }}"
    project_name: "{{ gitea_compose_project }}"
    state: restarted

# Scoped to the sidecar only (`services:`) — a TLS copy refreshing on gw01's
# renewal schedule should not bounce Gitea itself, which is a far more
# disruptive restart than this redirect vhost needs.
- name: Restart gitea ssh redirect
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ gitea_compose_dir }}"
    project_name: "{{ gitea_compose_project }}"
    state: restarted
    services:
      - ssh-redirect
