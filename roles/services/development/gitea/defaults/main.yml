---
# services/development/gitea — a single-user Git host on cmp01, for local
# development. This is the first `services/development/*` role in the fleet;
# it gets its own category rather than being wedged into productivity or
# knowledge because "hosts my own repos" is a distinct concern from either.
#
# Moved here from util01 (2026-09) for two reasons:
#   1. util01's disk is not redundant. Gitea holds the one thing on this
#      fleet that cannot be regenerated — repos with no upstream mirror, plus
#      the users/issues/PRs metadata — and it does not belong on a single
#      disk with no protection against drive failure.
#   2. Gitea Actions (CI runners) will need real compute that util01 does not
#      have. cmp01 is the fleet's compute node (8c/16t, 32 GB, A4000) — moving
#      now avoids a second migration once Actions is turned on.
# See the storage-split comments below for how this changes where each part
# of Gitea's data lives.

gitea_root_dir: "{{ service_root }}/gitea"
gitea_compose_dir: "{{ gitea_root_dir }}/compose"

# --- Storage split: SQLite on LOCAL disk, repos+LFS on NFS -------------------
# The split is deliberate, not incidental, and each half must stay on its own
# side of it:
#
# - gitea_data_dir (app.ini, the SQLite db, sessions) stays on cmp01's LOCAL
#   disk, exactly as it was on util01. SQLite depends on POSIX advisory file
#   locking to serialize writes safely, and NFS implements POSIX locking
#   incompletely — semantics vary by server/client and caching can mask a
#   conflict entirely. The failure mode is NOT an error you'd notice; it is a
#   silently corrupt database. Do not "tidy" this onto the NFS mount below —
#   that is exactly the mistake this split exists to prevent.
# - gitea_repos_dir (git repositories + LFS objects) goes on NFS from nas01
#   (TrueNAS, 10.0.2.6, RAIDZ2). Gitea touches these as plain files via
#   git/git-lfs, which have no locking requirement NFS can't meet, and they
#   are also the bulk of the storage growth (code + binary LFS blobs) — which
#   is the redundancy this data actually needs, since util01's local disk
#   (and cmp01's, for that matter) has none.
#
# See roles/system/nfs_mounts/defaults/main.yml for the mount itself — the
# TrueNAS export it depends on does NOT exist yet and must be created by
# hand — and hosts/host_vars/cmp01/vars.yml for why BOTH halves are also in
# restic (this split is about corruption risk and storage growth, not about
# which half is worth backing up).
gitea_data_dir: "{{ gitea_root_dir }}/data"

# gitea_nfs_export / gitea_repos_dir are deliberately NOT defined here. They
# live in hosts/group_vars/all/vars.yml because nas01's play (which defines the
# export) never loads this role, and a role default would be undefined there.

# Container-side paths. /data (gitea_data_dir) is local; /repos is the NFS
# mount, kept as a distinct top-level path inside the container specifically
# so the two are never confusable in an env file or a shell on the box.
gitea_repo_root_path: "/repos"
gitea_lfs_path: "{{ gitea_repo_root_path }}/lfs"

# The uid/gid the gitea/gitea image's entrypoint creates its `git` user with
# (USER_UID/USER_GID, both default to 1000 upstream and are not overridden
# below). The local data dir is chowned to these so the container's own user
# owns its db/config outright, rather than needing a chown-on-start step —
# same reasoning as researchd_uid/gid in services/ai/researchd, and the
# n8n uid 1000 fix in services/productivity/n8n. The NFS export must be
# created with this same uid/gid as owner (see nfs_mounts role) so the
# container can write repos/LFS to it without a maproot.
gitea_uid: 1000
gitea_gid: 1000

gitea_compose_project: "gitea"
gitea_container_name: "gitea"

# Both free in this fleet — checked against every `*_port` default across
# roles/ before picking them (see the task's verification step).
gitea_http_port: 8102

# The HOST publish of Gitea's container port 22 (docker-compose.yml.j2's
# `ports:`). Kept only so the OLD clone URL (`ssh.git.{{ base_domain }}:2222`)
# keeps working during the transition to the portless one below — it is now
# redundant with the macvlan sidecar and can be dropped once nobody uses it.
gitea_ssh_host_port: 2222

# The port clone URLs now ADVERTISE (GITEA__server__SSH_PORT). Plain 22,
# because clones go through gitea_ssh_ip's own port 22 (the macvlan sidecar
# below), not through gitea_ssh_host_port anymore. This is a DIFFERENT thing
# from SSH_LISTEN_PORT (gitea.env.j2), which is what the container itself
# binds and stays 22 always — conflating the two is exactly how a clone URL
# ends up lying about how to reach it.
gitea_ssh_advertised_port: 22

# The host clone-over-SSH URLs must point at, and it is NOT gitea_domain.
# `git.{{ base_domain }}` resolves to gw01, which terminates HTTPS for the web
# UI and cannot also speak SSH (nginx there proxies HTTP only). This name
# instead resolves straight to gitea_ssh_ip below (see blocky's
# blocky_extra_mappings) — Gitea's own dedicated LAN IP, not cmp01's, and not
# gw01's. Advertising the proxy name would hand out clone URLs that cannot
# connect.
gitea_ssh_domain: "ssh.git.{{ base_domain }}"

# --- Portless SSH: a dedicated LAN IP via Docker macvlan ---------------------
# cmp01's own sshd binds 0.0.0.0:22, so nothing else on that HOST can also own
# port 22 — there is no way to publish a second, unrelated :22 on cmp01's own
# address. A Docker macvlan network sidesteps the conflict entirely instead of
# working around it: it gives one container a REAL LAN IP with its OWN network
# stack, so that container has its own port 22, completely independent of (and
# never touching) cmp01's sshd. This is the only way to get a portless clone
# URL here without moving the host's sshd — do not substitute a host port
# remap or an iptables trick for it.
#
# Chosen by the user, verified free and outside the DHCP pool.
gitea_ssh_ip: "10.0.2.18"

# Parent interface + subnet/gateway for the macvlan network, both taken
# directly from cmp01's live `ip -4 addr show enp42s0` on 2026-09-07 — the
# mask really is /8 on this host (not the usual /24); do not "correct" it.
gitea_macvlan_parent_iface: "enp42s0"
# 10.0.0.0/8, not 10.0.2.0/8: a /8's network address has the last three
# octets zero, and Docker rejects a subnet with host bits set outright
# ("invalid CIDR address"). The mask really is /8 — cmp01's own address is
# 10.0.2.5/8 — so this describes the LAN correctly; it is only the network
# address that has to be written properly.
gitea_macvlan_subnet: "10.0.0.0/8"

# Constrains Docker's IPAM to exactly the one address we hand out. Without it
# Docker believes it owns the whole of 10.0.0.0/8 and is free to allocate any
# address in it to a future container — i.e. straight on top of a live host.
gitea_macvlan_ip_range: "{{ gitea_ssh_ip }}/32"
gitea_macvlan_gateway: "10.0.2.1"

# --- ssh.git sidecar: SSH proxy + HTTPS redirect, one container -------------
# A single nginx:alpine container on gitea_ssh_ip does BOTH jobs, because
# nginx:alpine ships the stream module compiled in already — standing up a
# second container just to avoid sharing one would be pure overhead:
#   - stream{} on :22   -> proxy_pass to Gitea's container port 22, reached by
#     compose service name on the project's own (bridge) network. NOT via
#     gitea_ssh_host_port on the host — going back out to the host and in
#     again would be a pointless hop, and would break the day that publish is
#     dropped (see the comment on it above).
#   - http{} on :80/:443 -> 301 to https://git.{{ base_domain }}, for anyone
#     who types the SSH name into a browser.
# See templates/nginx.conf.j2 for the actual config, and tasks/main.yml for
# where its TLS cert/key come from.
gitea_ssh_redirect_container_name: "gitea-ssh-redirect"

# Pinned by tag+digest, same posture as gitea_image above and searxng_image in
# roles/services/ai/researchd/defaults/main.yml — the digest is the
# manifest-LIST digest (not a per-platform one), confirmed to include
# linux/amd64 (cmp01 is a Debian PC, not arm) by fetching Docker Hub's
# registry API for this manifest list directly on 2026-09-07. Bump by hand.
gitea_ssh_redirect_image_repo: "nginx"
gitea_ssh_redirect_image_tag: "alpine"
gitea_ssh_redirect_image_digest: "sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3"
gitea_ssh_redirect_image: "{{ gitea_ssh_redirect_image_repo }}:{{ gitea_ssh_redirect_image_tag }}@{{ gitea_ssh_redirect_image_digest }}"

# --- TLS for the ssh.git redirect vhost --------------------------------------
# cmp01 has no certificate of its own and the fleet has NO cert-distribution
# mechanism. certbot on gw01 (roles/services/network/certbot) is the only
# place *.git.{{ base_domain }} is actually issued — that SAN exists
# specifically for this name (a wildcard SAN matches exactly one label, so
# *.{{ base_domain }} alone does not cover ssh.git.{{ base_domain }}, two
# labels deep). See tasks/main.yml for the full staleness caveat around
# copying it here.
gitea_tls_dir: "{{ gitea_root_dir }}/tls"
gitea_tls_cert_file: "{{ gitea_tls_dir }}/fullchain.pem"
gitea_tls_key_file: "{{ gitea_tls_dir }}/privkey.pem"

# Source paths on gw01. certbot_cert_name (services/network/certbot/defaults)
# is base_domain, so this is where certbot actually writes the lineage that
# covers *.git.{{ base_domain }} — kept as plain base_domain-derived paths
# here rather than depending on the certbot role's own vars, since cmp01's
# play never loads that role.
gitea_tls_source_cert: "/etc/letsencrypt/live/{{ base_domain }}/fullchain.pem"
gitea_tls_source_key: "/etc/letsencrypt/live/{{ base_domain }}/privkey.pem"

# --- Image ------------------------------------------------------------------
# Pinned by tag+digest, same posture as searxng_image in
# roles/services/ai/researchd/defaults/main.yml — a floating tag is exactly
# what Diun would flag elsewhere in this fleet, and pinning removes the
# question entirely. The digest is the multi-arch manifest-LIST digest (docker
# resolves the right platform-specific manifest under it automatically, same
# as researchd_llama_image), not a per-platform manifest digest.
#
# Verified against Docker Hub's registry API 2026-09-06: `gitea/gitea:1.27.3`
# (latest stable release; pushed 2026-08-29) resolves to this manifest list,
# which was fetched directly and confirmed to include BOTH linux/amd64 (cmp01
# is a Debian PC, not arm64) and linux/arm64. Bump by hand.
gitea_image_repo: "gitea/gitea"
gitea_image_tag: "1.27.3"
gitea_image_digest: "sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef"
gitea_image: "{{ gitea_image_repo }}:{{ gitea_image_tag }}@{{ gitea_image_digest }}"

# --- Database -----------------------------------------------------------
# SQLite, not a Postgres sidecar. This is a single-user instance for a
# handful of personal repos — Postgres's own container, volume, and backup
# surface would be pure overhead for a workload SQLite handles fine at this
# scale (Gitea's own docs recommend SQLite specifically for "small,
# single-user or few-user" instances). Revisit only if this ever grows
# multi-user or repo count gets large enough for SQLite's single-writer
# lock to become a real bottleneck.
gitea_db_type: "sqlite3"

# --- Registration / access -----------------------------------------------
# Single-user instance, own login: registration is OFF and anonymous
# browsing is OFF, so nginx can leave this `sso: false` (see
# hosts/host_vars/gw01/vars.yml) without opening the door to anyone but the
# admin account created below.
gitea_disable_registration: true
gitea_require_signin_view: true

# --- Admin account --------------------------------------------------------
# Username only — email and password are handled separately below.
gitea_admin_username: "uknth"
# Fleet convention for an admin contact address: the same var certbot's ACME
# registration and Authentik's bootstrap use (roles/services/auth/authentik/
# defaults/main.yml), not a new one.
gitea_admin_email: "{{ vault_certbot_email | default('admin@' + base_domain) }}"

# Password is GENERATED ON THE HOST, not stored in the vault — see the
# tasks/main.yml comment block for the full reasoning (same pattern as
# researchd's SearXNG secret key). Kept at 0600, under the compose dir
# rather than inside gitea_data_dir so it is never accidentally swept up by
# anything that treats the data dir as "the container's own business".
gitea_admin_password_file: "{{ gitea_compose_dir }}/.admin_password"

# --- URLs -----------------------------------------------------------------
gitea_domain: "git.{{ base_domain }}"
gitea_root_url: "https://{{ gitea_domain }}/"
