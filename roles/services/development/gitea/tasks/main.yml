---
# services/development/gitea — single-user Git host on cmp01. See
# defaults/main.yml for why each value is what it is.

- name: Create gitea dirs
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0755"
  loop:
    - "{{ gitea_root_dir }}"
    - "{{ gitea_compose_dir }}"
    # NOT gitea_data_dir — the task below owns it, as the CONTAINER's uid
    # rather than `user`. Creating it here too made the two tasks fight: this
    # one chowned it back to `user` on every run, that one chowned it to the
    # git uid again, and both reported `changed` forever.

# Owned by the container's own uid/gid (see gitea_uid/gid in defaults) so the
# `git` user the image runs as owns its repos/db/config outright, rather than
# needing the entrypoint to chown a host-owned tree on every start.
- name: Create the gitea data dir owned by the container's git user
  become: true
  ansible.builtin.file:
    path: "{{ gitea_data_dir }}"
    state: directory
    owner: "{{ gitea_uid }}"
    group: "{{ gitea_gid }}"
    mode: "0755"

# The admin account's BOOTSTRAP password, and only that. It is used once, to
# create the account on a fresh instance; the moment the account exists it is
# the running Gitea that owns the password, not this file. Changing it in the
# UI is expected and does NOT make the deployment drift — the create command
# below is a no-op from then on, and this file simply goes stale. It is kept
# so a rebuild from an empty volume can still be logged into.
#
# Do NOT move this into the vault. That would imply Ansible manages the
# password, and the only way to make that true is to reset it on every run —
# silently overwriting whatever the user set.
#
# Generated once and persisted on disk (NOT a
# vault secret — this role must not require editing hosts/group_vars/all/
# vault.yml, which is encrypted) so re-running the role doesn't rotate it out
# from under the one person who uses this instance.
#
# Generated and read back ON THE REMOTE HOST, deliberately not via the
# `password` lookup plugin: that lookup writes/reads its file on whatever
# machine runs `ansible-playbook`, not necessarily cmp01 — same reasoning as
# the SearXNG secret key in roles/services/ai/researchd/tasks/main.yml, copied
# here directly.
- name: Check whether a Gitea admin password already exists
  ansible.builtin.stat:
    path: "{{ gitea_admin_password_file }}"
  register: _gitea_password_stat

- name: Generate a Gitea admin password
  become: true
  # Safe under --check: creating a not-yet-existing secret is not destructive
  # (same posture as the SearXNG key task this mirrors), and the compose/env
  # rendering below needs the file to actually exist even during a dry run.
  check_mode: false
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    openssl rand -hex 24 > {{ gitea_admin_password_file }}
  args:
    creates: "{{ gitea_admin_password_file }}"
    # bash explicitly: `set -o pipefail` is a bashism, and on Debian /bin/sh is
    # dash, which rejects it outright ("Illegal option -o pipefail"). This role
    # was written against ctl01 (macOS) where /bin/sh accepts it, so the bug
    # only surfaced when Gitea moved to cmp01.
    executable: /bin/bash
  when: not _gitea_password_stat.stat.exists

- name: Fix ownership and mode on the Gitea admin password
  become: true
  ansible.builtin.file:
    path: "{{ gitea_admin_password_file }}"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0600"

- name: Read back the Gitea admin password
  become: true
  ansible.builtin.slurp:
    src: "{{ gitea_admin_password_file }}"
  register: _gitea_password_slurp
  no_log: true

- name: Set the Gitea admin password fact
  ansible.builtin.set_fact:
    _gitea_admin_password: "{{ (_gitea_password_slurp.content | b64decode).strip() }}"
  no_log: true

- name: Template gitea compose
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ gitea_compose_dir }}/docker-compose.yml"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0644"
  notify: Restart gitea

# Carries no secrets itself (the admin password is set out-of-band via the
# CLI task below, never through the environment) but templated the same way
# as every other compose env file in this fleet for consistency.
- name: Template the gitea env file
  become: true
  ansible.builtin.template:
    src: gitea.env.j2
    dest: "{{ gitea_compose_dir }}/gitea.env"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0640"
  notify: Restart gitea

- name: Deploy gitea
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ gitea_compose_dir }}"
    project_name: "{{ gitea_compose_project }}"
    state: present
    pull: missing

# Gitea writes app.ini and creates its SQLite schema on first boot, a few
# seconds AFTER the container reports running. `gitea admin user create`
# against a database whose tables do not exist yet fails on a missing table —
# a race that shows up only on a first deploy and looks like a config error.
# Wait for the HTTP port to answer instead of assuming the container being up
# means Gitea is ready.
- name: Wait for Gitea to finish initialising
  become: true
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ gitea_http_port }}"
    timeout: 120
    delay: 2

# Idempotent admin bootstrap: `gitea admin user create` exits non-zero with
# "user already exists" once the account is there, and that must not fail the
# play on every subsequent run — so the failure is inspected rather than
# trusted to changed_when/failed_when defaults.
#
# no_log: true on the whole task, not just this one field, because the
# password is a literal argv element here (openssl-generated hex, so no shell
# metacharacters to worry about, but still not something to leave in a log).
# Rewrites ~git/.ssh/authorized_keys from the database. Idempotent, and worth
# running every deploy rather than once: that file lives in the git user's HOME
# (/data/git/.ssh), NOT under the repository root, so anything that rebuilds or
# relocates the data directory leaves it behind. Exactly that happened moving
# from util01 — repositories went to NFS and the database came across, but
# authorized_keys did not, and every SSH push failed with "Permission denied
# (publickey)" against a database that held the key perfectly well.
- name: Regenerate the git user's authorized_keys from the database
  become: true
  ansible.builtin.command:
    cmd: docker exec -u git {{ gitea_container_name }} gitea admin regenerate keys
  register: _gitea_regen_keys
  changed_when: false

- name: Create the Gitea admin user (idempotent — already-exists is not a failure)
  become: true
  ansible.builtin.command:
    cmd: >-
      docker exec -u git {{ gitea_container_name }}
      gitea admin user create
      --username {{ gitea_admin_username }}
      --password {{ _gitea_admin_password }}
      --email {{ gitea_admin_email }}
      --admin
      --must-change-password=false
  register: _gitea_admin_create
  changed_when: >-
    _gitea_admin_create.rc == 0
    and 'already exists' not in (_gitea_admin_create.stdout + _gitea_admin_create.stderr)
  failed_when: >-
    _gitea_admin_create.rc != 0
    and 'already exists' not in (_gitea_admin_create.stdout + _gitea_admin_create.stderr)
  no_log: true
