---
# services/auth/authentik_config — configures Authentik objects via its API
# (idempotent). Currently: a domain-level forward-auth proxy provider bound to
# the embedded outpost, so nginx forward-auth gates all *.puhome.net at once.
#
# Runs on util01 against the local API. Needs vault_authentik_api_token.

authentik_api: "http://localhost:9000/api/v3"
authentik_api_token: "{{ vault_authentik_api_token }}"

# Domain-level forward-auth provider
authentik_fa_provider_name: "homelab-forward-auth"
authentik_fa_app_slug: "homelab-forward-auth"
authentik_fa_app_name: "Homelab Forward Auth"
authentik_fa_external_host: "https://auth.{{ base_domain }}"
authentik_fa_cookie_domain: "{{ base_domain }}"
authentik_fa_authz_flow_slug: "default-provider-authorization-implicit-consent"
authentik_fa_invalidation_flow_slug: "default-provider-invalidation-flow"

# --- OIDC apps (reproducible: fixed client creds from vault) ---
authentik_signing_key_name: "authentik Self-signed Certificate"
authentik_oidc_scopes: ["openid", "email", "profile"]
authentik_oidc_grant_types: ["authorization_code", "refresh_token"]
# Each entry: slug, name, redirect (list of URLs), launch, client_id, secret
authentik_oidc_apps:
  - slug: paperless
    name: Paperless
    redirect: ["https://docs.{{ base_domain }}/accounts/oidc/authentik/login/callback/"]
    launch: "https://docs.{{ base_domain }}"
    client_id: "{{ vault_paperless_oidc_client_id }}"
    secret: "{{ vault_paperless_oidc_client_secret }}"
  - slug: portainer
    name: Portainer
    redirect: ["https://docker.{{ base_domain }}"]
    launch: "https://docker.{{ base_domain }}"
    client_id: "{{ vault_portainer_oidc_client_id }}"
    secret: "{{ vault_portainer_oidc_client_secret }}"
  - slug: beszel
    name: Beszel
    redirect: ["https://metrics.{{ base_domain }}/api/oauth2-redirect"]
    launch: "https://metrics.{{ base_domain }}"
    client_id: "{{ vault_beszel_oidc_client_id }}"
    secret: "{{ vault_beszel_oidc_client_secret }}"
  - slug: jellyfin
    name: Jellyfin
    redirect: ["https://video.{{ base_domain }}/sso/OID/redirect/authentik", "http://video.{{ base_domain }}/sso/OID/redirect/authentik"]
    launch: "https://video.{{ base_domain }}"
    client_id: "{{ vault_jellyfin_oidc_client_id }}"
    secret: "{{ vault_jellyfin_oidc_client_secret }}"
  - slug: kavita
    name: Kavita
    redirect: ["https://books.{{ base_domain }}/signin-oidc"]
    launch: "https://books.{{ base_domain }}"
    client_id: "{{ vault_kavita_oidc_client_id }}"
    secret: "{{ vault_kavita_oidc_client_secret }}"
  - slug: homarr
    name: Homarr
    redirect: ["https://dash.{{ base_domain }}/api/auth/callback/oidc"]
    launch: "https://dash.{{ base_domain }}"
    client_id: "{{ vault_homarr_oidc_client_id }}"
    secret: "{{ vault_homarr_oidc_client_secret }}"
