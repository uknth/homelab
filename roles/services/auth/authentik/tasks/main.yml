---
# Deploy Authentik (SSO) on util01.

- name: Create Authentik directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0755"
  loop:
    - "{{ authentik_root_dir }}"
    - "{{ authentik_root_dir }}/compose"
    - "{{ authentik_root_dir }}/pgdata"
    - "{{ authentik_root_dir }}/redis"
    - "{{ authentik_root_dir }}/media"
    - "{{ authentik_root_dir }}/custom-templates"
    - "{{ authentik_root_dir }}/certs"

- name: Template Authentik compose + env
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ authentik_root_dir }}/compose/{{ item.dest }}"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0640"
  loop:
    - { src: docker-compose.yml.j2, dest: docker-compose.yml }
    - { src: env.j2, dest: .env }
  no_log: true
  notify: Restart authentik

- name: Deploy Authentik
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_root_dir }}/compose"
    project_name: "authentik"
    state: present
    pull: missing

- name: Wait for Authentik to answer HTTP
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ authentik_http_port }}/-/health/live/"
    status_code: [200, 204]
  register: _ak_health
  retries: 30
  delay: 10
  until: _ak_health.status in [200, 204]
