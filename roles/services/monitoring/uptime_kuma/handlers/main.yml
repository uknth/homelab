---
- name: Restart uptime_kuma
  # Skipped under --check: a dry run cannot restart anything, and on a host
  # where this role has never deployed the compose dir does not exist yet.
  when: not ansible_check_mode
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ uptime_kuma_root_dir }}/compose"
    project_name: "uptime-kuma"
    state: restarted
