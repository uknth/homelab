---
- name: Create beszel hub dirs
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0755"
  loop:
    - "{{ beszel_hub_root_dir }}"
    - "{{ beszel_hub_root_dir }}/compose"
    - "{{ beszel_hub_root_dir }}/data"
- name: Template beszel hub compose
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ beszel_hub_root_dir }}/compose/docker-compose.yml"
    owner: "{{ user }}"
    group: "{{ user }}"
    mode: "0644"
  notify: Restart beszel_hub
- name: Deploy beszel hub
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ beszel_hub_root_dir }}/compose"
    project_name: "beszel"
    state: present
    pull: missing

# --- Configure Authentik OIDC (idempotent) ---
- name: Ensure Beszel superuser exists
  become: true
  ansible.builtin.command: >-
    docker exec beszel /beszel superuser upsert
    "{{ beszel_superuser_email }}" "{{ beszel_superuser_password }}"
  register: _bz_su
  changed_when: "'Successfully' in _bz_su.stdout"
  no_log: true

- name: Wait for Beszel API
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_hub_port }}/api/health"
    status_code: 200
  register: _bz_health
  check_mode: false
  retries: 15
  delay: 3
  until: _bz_health.status == 200

- name: Authenticate as superuser
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_hub_port }}/api/collections/_superusers/auth-with-password"
    method: POST
    body_format: json
    body: { identity: "{{ beszel_superuser_email }}", password: "{{ beszel_superuser_password }}" }
  register: _bz_auth
  check_mode: false
  no_log: true

- name: Set Beszel app URL (needed for OAuth redirects)
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_hub_port }}/api/settings"
    method: PATCH
    headers:
      Authorization: "{{ _bz_auth.json.token }}"
    body_format: json
    body:
      meta:
        appName: Beszel
        appURL: "https://metrics.{{ base_domain }}"
    status_code: 200
  no_log: true
  changed_when: true

- name: Configure OIDC on the users collection
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_hub_port }}/api/collections/users"
    method: PATCH
    headers:
      Authorization: "{{ _bz_auth.json.token }}"
    body_format: json
    body:
      oauth2:
        enabled: true
        providers:
          - name: oidc
            clientId: "{{ beszel_oidc_client_id }}"
            clientSecret: "{{ beszel_oidc_client_secret }}"
            authURL: "{{ authentik_oidc_authorize_url }}"
            tokenURL: "{{ authentik_oidc_token_url }}"
            userInfoURL: "{{ authentik_oidc_userinfo_url }}"
            displayName: Authentik
            pkce: true
    status_code: 200
  no_log: true
  changed_when: true

# --- Register monitored systems (idempotent) ---
# Beszel shows nothing until each agent host is registered as a "system". Agents
# run in classic listen mode (system/beszel_agent), so the hub just needs a
# record with host+port and it connects using its key. Owned by all current
# users; skipped entirely until at least one user exists (first OIDC login).
- name: Get Beszel users (systems need an owner)
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_hub_port }}/api/collections/users/records?perPage=200"
    headers:
      Authorization: "{{ _bz_auth.json.token }}"
  register: _bz_users
  check_mode: false
  no_log: true

- name: Get already-registered systems
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_hub_port }}/api/collections/systems/records?perPage=200"
    headers:
      Authorization: "{{ _bz_auth.json.token }}"
  register: _bz_systems
  check_mode: false

- name: Register a system per Linux agent host
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_hub_port }}/api/collections/systems/records"
    method: POST
    headers:
      Authorization: "{{ _bz_auth.json.token }}"
    body_format: json
    body:
      name: "{{ item }}"
      host: "{{ hostvars[item].ansible_host }}"
      port: "{{ beszel_hub_agent_port | string }}"
      users: "{{ _bz_users.json['items'] | map(attribute='id') | list }}"
    status_code: [200, 400]
  loop: "{{ beszel_register_hosts }}"
  when:
    - _bz_users.json.totalItems | int > 0
    - item not in (_bz_systems.json['items'] | map(attribute='name') | list)

# --- Host-health alerting: ntfy webhook + per-system alerts (idempotent) ---
- name: Get user settings
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_hub_port }}/api/collections/user_settings/records?perPage=200"
    headers:
      Authorization: "{{ _bz_auth.json.token }}"
  register: _bz_usettings
  check_mode: false
  when: _bz_users.json.totalItems | int > 0

- name: Ensure ntfy webhook is in user settings
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_hub_port }}/api/collections/user_settings/records/{{ item.id }}"
    method: PATCH
    headers:
      Authorization: "{{ _bz_auth.json.token }}"
    body_format: json
    body:
      settings: "{{ item.settings | combine({'webhooks': [beszel_ntfy_webhook]}) }}"
    status_code: [200]
  loop: "{{ _bz_usettings.json['items'] | default([]) }}"
  loop_control:
    label: "{{ item.user }}"
  when:
    - _bz_users.json.totalItems | int > 0
    - beszel_ntfy_webhook not in (item.settings.webhooks | default([]))

- name: Get existing alerts
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_hub_port }}/api/collections/alerts/records?perPage=500"
    headers:
      Authorization: "{{ _bz_auth.json.token }}"
  register: _bz_alerts
  check_mode: false
  when: _bz_users.json.totalItems | int > 0

- name: Create per-system health alerts
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_hub_port }}/api/collections/alerts/records"
    method: POST
    headers:
      Authorization: "{{ _bz_auth.json.token }}"
    body_format: json
    body:
      user: "{{ _bz_users.json['items'][0].id }}"
      system: "{{ item.0.id }}"
      name: "{{ item.1.name }}"
      value: "{{ item.1.value }}"
      min: "{{ item.1.min }}"
      triggered: false
    status_code: [200, 400]
  loop: "{{ (_bz_systems.json['items'] | default([])) | product(beszel_alert_specs) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1.name }}"
  when:
    - _bz_users.json.totalItems | int > 0
    - (_bz_alerts.json['items'] | default([]) | selectattr('system','equalto',item.0.id) | selectattr('name','equalto',item.1.name) | list | length) == 0
