---
# All work happens on the control node (WebSocket client -> Home Assistant).
- name: Ensure websocket-client is available in a venv
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  ansible.builtin.pip:
    name: websocket-client
    virtualenv: "{{ ha_config_venv }}"
    virtualenv_command: "python3 -m venv"

# Skipped under --check (the GitOps executor's dry run): the venv above does not
# exist yet on a first run, so the script cannot run. The script itself is
# read-then-write and only writes keys that differ.
- name: Apply Home Assistant core config (idempotent by key)
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  ansible.builtin.command:
    argv:
      - "{{ ha_config_venv }}/bin/python"
      - "{{ role_path }}/files/configure_ha.py"
  environment:
    HA_URL: "{{ ha_config_url }}"
    HA_TOKEN: "{{ ha_config_token }}"
    HA_CORE: "{{ _ha_core | combine(_ha_location) | to_json }}"
    HA_HOSTNAME: "{{ ha_hostname | default('') }}"
  vars:
    _ha_core:
      location_name: "{{ ha_location_name }}"
      time_zone: "{{ ha_time_zone }}"
      unit_system: "{{ ha_unit_system }}"
      language: "{{ ha_language }}"
      country: "{{ ha_country }}"
      currency: "{{ ha_currency }}"
      elevation: "{{ ha_elevation | int }}"
      radius: "{{ ha_radius | int }}"
    _ha_location: "{{ {'latitude': ha_latitude | float, 'longitude': ha_longitude | float} if ha_latitude is defined and ha_longitude is defined else {} }}"
  register: _ha_sync
  changed_when: (_ha_sync.stdout | from_json).changed | length > 0
  no_log: true

- name: Show what changed
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  ansible.builtin.debug:
    msg: "{{ (_ha_sync.stdout | from_json).changed or 'Home Assistant already matches' }}"
  when: (_ha_sync.stdout | default('')) | length > 0
