- name: Check current kind version
  ansible.builtin.command: /usr/local/bin/kind --version
  register: kind_version_result
  changed_when: false
  failed_when: false

- name: Set installed_kind_version fact
  ansible.builtin.set_fact:
    installed_kind_version: "{{ kind_version_result.stdout | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+') }}"
  when: kind_version_result.rc == 0

- name: Install/Update kind
  when: installed_kind_version | default('') != kind_version
  block:
    - name: Create downloads directory
      ansible.builtin.file:
        path: "{{ data_dir }}/downloads"
        state: directory
        mode: '0755'

    - name: Download kind binary ({{ kind_version }})
      ansible.builtin.get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: "{{ data_dir }}/downloads/kind-{{ kind_version }}"
        mode: '0755'

    - name: Install kind binary
      become: true
      ansible.builtin.copy:
        src: "{{ data_dir }}/downloads/kind-{{ kind_version }}"
        dest: /usr/local/bin/kind
        mode: '0755'
        remote_src: true
