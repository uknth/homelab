---
# CI for the homelab repo, run on cmp01's Gitea Actions runner (see
# roles/services/development/gitea_runner). Every job here is a static
# check against the checked-out repo — nothing reads a vault password, an
# SSH key, or touches a real host. That is a hard requirement of the runner
# this executes on, not a style choice: see the "NO FLEET CREDENTIALS"
# block at the top of roles/services/development/gitea_runner/defaults/
# main.yml. Do not add a step here that needs one.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  # .yamllint at the repo root relaxes exactly two things this repo does
  # deliberately (long WHY comments, column-aligned flow mappings in
  # hosts/host_vars/{gw01,ctl01}/vars.yml) and excludes archive/ (retired
  # v2, not held to current conventions) — see that file's own comments.
  yamllint:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      # Plain git clone rather than actions/checkout@v4, and deliberately so.
      # checkout is a JavaScript action: act_runner executes it with node
      # INSIDE the job container, and python:3.12-slim has no node — so every
      # job failed in about three seconds with nothing useful in the log.
      #
      # Fixing it by switching to a node-bearing image would give up the exact
      # 3.12 interpreter these tests need (3.14 cannot build pydantic-core
      # here, and it masks a gpt-researcher bug). Cloning by hand keeps the
      # interpreter pinned AND removes CI's dependency on fetching actions
      # from github.com, which a self-hosted homelab runner has no business
      # needing.
      - name: Checkout
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
          git config --global --add safe.directory "$PWD"
          # The repo is PRIVATE, so an anonymous clone fails with
          #   fatal: could not read Username for '...': No such device or address
          # GITEA_TOKEN is injected into every workflow run by Gitea itself and
          # is scoped to this repository and this run — it is not a standing
          # credential and does not need to be added as a secret by hand.
          # act_runner masks it in logs.
          HOST="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "http://x-access-token:${GITEA_TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" .
        env:
          # Keeps apt from trying dialog/readline frontends it cannot use in a
          # non-tty job container and emitting eight lines of noise per job.
          DEBIAN_FRONTEND: noninteractive
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      - name: Install yamllint
        run: pip install --quiet yamllint
      - name: yamllint
        run: yamllint -c .yamllint .

  # .ansible-lint pins profile: min (ansible-lint's smallest — only what it
  # needs to run at all) and excludes archive/ for the same reason as
  # yamllint above. Verified 2026-09-07 against this repo at min: 0
  # failures with the full `ansible` package installed (not just
  # ansible-lint's own ansible-core dependency) — its internal syntax-check
  # phase fails to resolve ansible.posix.* modules otherwise, even though
  # this repo's own requirements.yml never lists ansible.posix. Tighten
  # the profile as a deliberate follow-up, not as part of standing this up.
  ansible-lint:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      # Plain git clone rather than actions/checkout@v4, and deliberately so.
      # checkout is a JavaScript action: act_runner executes it with node
      # INSIDE the job container, and python:3.12-slim has no node — so every
      # job failed in about three seconds with nothing useful in the log.
      #
      # Fixing it by switching to a node-bearing image would give up the exact
      # 3.12 interpreter these tests need (3.14 cannot build pydantic-core
      # here, and it masks a gpt-researcher bug). Cloning by hand keeps the
      # interpreter pinned AND removes CI's dependency on fetching actions
      # from github.com, which a self-hosted homelab runner has no business
      # needing.
      - name: Checkout
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
          git config --global --add safe.directory "$PWD"
          # The repo is PRIVATE, so an anonymous clone fails with
          #   fatal: could not read Username for '...': No such device or address
          # GITEA_TOKEN is injected into every workflow run by Gitea itself and
          # is scoped to this repository and this run — it is not a standing
          # credential and does not need to be added as a secret by hand.
          # act_runner masks it in logs.
          HOST="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "http://x-access-token:${GITEA_TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" .
        env:
          # Keeps apt from trying dialog/readline frontends it cannot use in a
          # non-tty job container and emitting eight lines of noise per job.
          DEBIAN_FRONTEND: noninteractive
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      - name: Install Ansible + ansible-lint
        run: pip install --quiet ansible ansible-lint
      # ansible-lint shells out to `ansible-playbook --syntax-check` itself, so
      # unlike the syntax-check job it cannot be handed --vault-password-file.
      # It reads ansible.cfg, which points vault_password_file at
      # ~/.config/homelab/.vault_pass — absent on a runner, so every one of the
      # 72 playbooks returned exit 1 and ansible-lint reported them all as
      # `internal-error`, which looks like 72 lint findings and is really one
      # missing file. The content is irrelevant: --syntax-check never decrypts
      # vault.yml, it only needs the file to exist.
      - name: Fake a vault password file where ansible.cfg expects it
        run: |
          mkdir -p ~/.config/homelab
          echo "unused-ci-placeholder" > ~/.config/homelab/.vault_pass
      - name: ansible-lint
        run: ansible-lint

  syntax-check:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      # Plain git clone rather than actions/checkout@v4, and deliberately so.
      # checkout is a JavaScript action: act_runner executes it with node
      # INSIDE the job container, and python:3.12-slim has no node — so every
      # job failed in about three seconds with nothing useful in the log.
      #
      # Fixing it by switching to a node-bearing image would give up the exact
      # 3.12 interpreter these tests need (3.14 cannot build pydantic-core
      # here, and it masks a gpt-researcher bug). Cloning by hand keeps the
      # interpreter pinned AND removes CI's dependency on fetching actions
      # from github.com, which a self-hosted homelab runner has no business
      # needing.
      - name: Checkout
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
          git config --global --add safe.directory "$PWD"
          # The repo is PRIVATE, so an anonymous clone fails with
          #   fatal: could not read Username for '...': No such device or address
          # GITEA_TOKEN is injected into every workflow run by Gitea itself and
          # is scoped to this repository and this run — it is not a standing
          # credential and does not need to be added as a secret by hand.
          # act_runner masks it in logs.
          HOST="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "http://x-access-token:${GITEA_TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" .
        env:
          # Keeps apt from trying dialog/readline frontends it cannot use in a
          # non-tty job container and emitting eight lines of noise per job.
          DEBIAN_FRONTEND: noninteractive
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      - name: Install Ansible
        # The full `ansible` package, not just `ansible-core` — it bundles
        # every community collection this repo's roles use
        # (community.docker, community.general, ansible.posix, ...), so
        # --syntax-check below can resolve every module FQCN with no
        # separate `ansible-galaxy collection install` step. Confirmed by
        # inspecting this package's own site-packages/ansible_collections/
        # on 2026-09-07 (community.docker and ansible.posix are both in
        # there); requirements.yml's external galaxy roles are unused by
        # anything under playbooks/hosts/ today, so they are not needed
        # here either.
        run: pip install --quiet ansible
      - name: Fake a vault password file
        # ansible.cfg sets vault_password_file to
        # ~/.config/homelab/.vault_pass, which does not exist on this
        # runner and never should — see the "NO FLEET CREDENTIALS" comment
        # at the top of this file; the real vault password least of all.
        # --syntax-check never actually decrypts
        # hosts/group_vars/all/vault.yml (verified locally: even a
        # deliberately wrong password here still passes), but Ansible
        # refuses to start at all unless --vault-password-file points at
        # SOME existing, non-empty, readable file — an empty file (or
        # /dev/null) is rejected too, with "Invalid vault password".
        run: echo "unused-ci-placeholder" > /tmp/fake-vault-pass
      - name: Syntax-check every playbook under playbooks/hosts/
        run: |
          set -euo pipefail
          for playbook in playbooks/hosts/*.yml; do
            echo "::group::${playbook}"
            ansible-playbook "${playbook}" --syntax-check \
              --vault-password-file=/tmp/fake-vault-pass
            echo "::endgroup::"
          done

  # roles/services/ai/researchd's two Python components, each pytest run as
  # its own step so a failure names exactly which suite broke. Both need
  # Python 3.12 specifically (not whatever `ubuntu-latest` would default
  # to) — this job's container: pins it the same way for both, matching
  # both components' own Dockerfiles (FROM python:3.12-slim): 3.14 breaks
  # pydantic-core builds here, and separately masks gpt-researcher's own
  # upstream annotation-ordering bug (see files/engines/gptr/Dockerfile's
  # "UPSTREAM BUG" comment) instead of hitting it — testing on 3.14 would
  # pass locally and then fail the moment the real 3.12 image is built.
  python-tests:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      # Plain git clone rather than actions/checkout@v4, and deliberately so.
      # checkout is a JavaScript action: act_runner executes it with node
      # INSIDE the job container, and python:3.12-slim has no node — so every
      # job failed in about three seconds with nothing useful in the log.
      #
      # Fixing it by switching to a node-bearing image would give up the exact
      # 3.12 interpreter these tests need (3.14 cannot build pydantic-core
      # here, and it masks a gpt-researcher bug). Cloning by hand keeps the
      # interpreter pinned AND removes CI's dependency on fetching actions
      # from github.com, which a self-hosted homelab runner has no business
      # needing.
      - name: Checkout
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
          git config --global --add safe.directory "$PWD"
          # The repo is PRIVATE, so an anonymous clone fails with
          #   fatal: could not read Username for '...': No such device or address
          # GITEA_TOKEN is injected into every workflow run by Gitea itself and
          # is scoped to this repository and this run — it is not a standing
          # credential and does not need to be added as a secret by hand.
          # act_runner masks it in logs.
          HOST="${GITHUB_SERVER_URL#*://}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "http://x-access-token:${GITEA_TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" .
        env:
          # Keeps apt from trying dialog/readline frontends it cannot use in a
          # non-tty job container and emitting eight lines of noise per job.
          DEBIAN_FRONTEND: noninteractive
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      - name: Install researchd/app dependencies
        run: pip install --quiet -r roles/services/ai/researchd/files/app/requirements.txt pytest
      - name: Test researchd/app
        run: pytest roles/services/ai/researchd/files/app
      - name: Install researchd/engines/gptr dependencies
        # gptr's own tests import researchd.models directly (see
        # files/engines/gptr/tests/conftest.py) — app/requirements.txt is
        # already installed by the step above; this adds gptr's own on top.
        # gpt-researcher itself is never really imported (conftest.py stubs
        # it in sys.modules before collection), so installing it here is
        # for parity with the real build, not a test dependency.
        run: pip install --quiet -r roles/services/ai/researchd/files/engines/gptr/requirements.txt
      - name: Test researchd/engines/gptr
        run: pytest roles/services/ai/researchd/files/engines/gptr
