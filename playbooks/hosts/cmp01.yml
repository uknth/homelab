---
# cmp01 — Compute node with GPU (Custom PC, Debian)
#
# Storage first (NFS mount), then GPU runtime, then services.
#   - nfs_mounts   : /mnt/media/data from nas01
#   - nvidia_docker: register NVIDIA runtime with Docker (Jellyfin NVENC)
#   - arr          : sonarr/radarr/lidarr/bazarr/prowlarr/qbittorrent (VPN=qbit only)
#   - jellyfin     : media server (NVENC) + jellyseerr
#   - kavita       : books/comics reader
#   - paperless    : document management (pending existing-data decision)
#   - vaultsync    : Obsidian vault mirror (headless Obsidian Sync client)
#   - vaultmerge   : merge the 3 vaults into one topic-organised tree
#   - vaultindex   : embeddings + LLM summaries -> enrichment sidecar
#   - quartz       : the wiki, built from the merged tree (wiki.puhome.net)
#
# Out of scope for v3 (user directive): Immich (photos), Vaultwarden (passwords).

- name: Deploy compute services on cmp01
  hosts: cmp01
  become: true
  gather_facts: true
  tags: [cmp01, compute]
  roles:
    - role: system/nfs_mounts
      tags: [nfs, storage]

    - role: system/nvidia_docker
      tags: [nvidia, gpu]

    - role: services/media/arr
      tags: [arr, media, downloader]

    - role: services/media/jellyfin
      tags: [jellyfin, media]

    - role: services/media/kavita
      tags: [kavita, media, books]

    - role: services/documents/paperless
      tags: [paperless, documents]

    - role: services/productivity/filebrowser
      tags: [filebrowser, files]

    - role: services/media/slskd
      tags: [slskd, music, downloader]

    - role: services/media/soularr
      tags: [soularr, music]

    - role: services/media/navidrome
      tags: [navidrome, music, player]

    - role: services/media/lms
      tags: [lms, music, wiim]

    # Knowledge base (phase 9a/9b). Order is the pipeline order and matters:
    # vaultsync owns the mirror, vaultmerge dissolves the three vaults into one
    # topic tree, quartz renders that single tree. Each mounts the previous
    # stage's output read-only.
    - role: services/knowledge/vaultsync
      tags: [vaultsync, knowledge, obsidian]

    - role: services/knowledge/vaultmerge
      tags: [vaultmerge, knowledge, wiki]

    - role: services/knowledge/vaultindex
      tags: [vaultindex, knowledge, ai]

    - role: services/knowledge/quartz
      tags: [quartz, knowledge, wiki]

    # Image-update notifier. Diun's docker provider watches a single endpoint,
    # so one instance runs per docker_hosts member (same shape as the beszel /
    # dozzle / portainer agents). Each reports to the shared ntfy topic and to
    # the n8n upgrade webhook on util01.
    - role: services/monitoring/diun
      tags: [diun, updates, monitoring]
