---
# cmp01 — Compute node with GPU (Custom PC, Debian)
#
# Storage first (NFS mount), then GPU runtime, then services.
#   - nfs_mounts   : /mnt/media/data from nas01
#   - nvidia_docker: register NVIDIA runtime with Docker (Jellyfin NVENC)
#   - arr          : sonarr/radarr/lidarr/bazarr/prowlarr/qbittorrent (VPN=qbit only)
#   - jellyfin     : media server (NVENC) + jellyseerr
#   - kavita       : books/comics reader
#   - paperless    : document management (pending existing-data decision)
#
# Out of scope for v3 (user directive): Immich (photos), Vaultwarden (passwords).

- name: Deploy compute services on cmp01
  hosts: cmp01
  become: true
  gather_facts: true
  tags: [cmp01, compute]
  roles:
    - role: system/nfs_mounts
      tags: [nfs, storage]

    - role: system/nvidia_docker
      tags: [nvidia, gpu]

    - role: services/media/arr
      tags: [arr, media, downloader]

    - role: services/media/jellyfin
      tags: [jellyfin, media]

    - role: services/media/kavita
      tags: [kavita, media, books]

    - role: services/documents/paperless
      tags: [paperless, documents]

    - role: services/productivity/filebrowser
      tags: [filebrowser, files]

    - role: services/media/slskd
      tags: [slskd, music, downloader]

    - role: services/media/soularr
      tags: [soularr, music]

    - role: services/media/navidrome
      tags: [navidrome, music, player]

