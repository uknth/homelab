---
# dns01 — Pi-hole DNS appliance (Raspberry Pi Zero)
#
# Config-only management of a tiny armv6 box: no docker / full bootstrap, and
# Pi-hole itself is installed by the official installer, not Ansible.
#   - hostname : sync OS hostname to inventory name
#   - pihole   : conditional-forward puhome.net -> Blocky, plus Pi-hole's owned
#                settings (setupVars keys, FTL conf) and adlists / allowlist /
#                regex lists (gravity.db). See docs/runbooks/dns01-pihole.md.

- name: Configure dns01 (Pi-hole)
  hosts: dns
  become: true
  gather_facts: true
  tags: [dns01, dns]
  roles:
    - role: system/hostname
      tags: [hostname, system]

    - role: system/device_keys
      tags: [device-keys, ssh, system]

    - role: services/network/pihole
      tags: [pihole, dns, network]
