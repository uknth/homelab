---
# gw01 — Network gateway (Raspberry Pi 5, Debian)
#
# Services:
#   - blocky   : DNS server + ad-blocking  (dns.host.puhome.net)
#   - nginx    : reverse proxy for all internal services
#   - certbot  : TLS certificates via Let's Encrypt / Cloudflare DNS

- name: Deploy gateway services on gw01
  hosts: gw01
  become: true
  tags: [gw01, gateway]
  roles:
    - role: services/network/blocky
      tags: [blocky, dns, network]

    - role: services/network/nginx
      tags: [nginx, network]

    - role: services/network/certbot
      tags: [certbot, tls, network]
