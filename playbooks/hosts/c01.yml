---
# c01 — Compute node with GPU (Custom PC, Debian)
#
# Services:
#   - arr stack  : sonarr, radarr, lidarr, bazarr, prowlarr, qbittorrent
#   - jellyfin   : media server + jellyseerr
#   - kavita     : book / comic reader
#   - immich     : photo management
#   - paperless  : document management
#   - vaultwarden: password manager

- name: Deploy compute services on c01
  hosts: c01
  become: true
  tags: [c01, compute]
  roles:
    - role: services/media/arr
      tags: [arr, media, downloader]

    - role: services/media/jellyfin
      tags: [jellyfin, media]

    - role: services/media/kavita
      tags: [kavita, media, books]

    - role: services/photos/immich
      tags: [immich, photos]

    - role: services/documents/paperless
      tags: [paperless, documents]

    - role: services/productivity/vaultwarden
      tags: [vaultwarden, passwords]
