---
# Bootstrap all macOS managed hosts.
#
# Play 1 — ansible-user setup
#   Connects as the admin user (prompted at runtime), creates the 'ansible'
#   service account if it doesn't already exist. Run once per machine.
#   Skip after first run with: --skip-tags ansible-user
#
#   ansible-playbook playbooks/bootstrap/macos.yml --ask-pass --ask-become-pass
#
# Play 2 — standard bootstrap (brew, hostname, network)
#   Connects as the 'ansible' user (normal operation).
#
# Note: Tailscale is NOT installed on macOS hosts. It runs on gw01 only, as a
# subnet router advertising 10.0.2.0/24, which covers the whole fleet.

- name: Bootstrap macOS hosts
  hosts: macos
  become: false
  gather_facts: false
  tags: [bootstrap, macos]
  pre_tasks:
    # Gather facts under `always` so fact-dependent roles (e.g. beszel_agent's
    # OS dispatch) work even when the play is invoked with a narrow --tags.
    - name: Gather facts
      ansible.builtin.setup:
      tags: [always]
  roles:
    #- role: system/brew
    #  tags: [brew, packages, system]

    - role: system/hostname
      tags: [hostname, system]

    - role: system/network
      tags: [network, static-ip, system]

    - role: system/beszel_agent
      tags: [beszel, beszel-agent, monitoring]
