---
# Bootstrap all Linux (Debian/Ubuntu) managed hosts.
- name: Bootstrap Linux hosts
  hosts: linux
  become: true
  tags: [bootstrap, linux]
  roles:
    - role: system/hostname
      tags: [hostname, system]

    - role: system/apt
      tags: [apt, packages, system]

    - role: system/ntp
      tags: [ntp, system]

    - role: system/docker
      tags: [docker, system]

    # Tailscale is NOT bootstrapped fleet-wide — it runs on gw01 only, as a
    # subnet router advertising 10.0.2.0/24. See playbooks/hosts/gw01.yml.

    - role: system/unattended_upgrades
      tags: [unattended-upgrades, patching, system]

    - role: system/beszel_agent
      tags: [beszel-agent, monitoring, system]
