- name: Debug nginx_cockpit_hosts
  ansible.builtin.debug:
    var: nginx_cockpit_hosts

- name: Setup certificate using 'certbot'
  become: true
  ansible.builtin.import_role:
    name: "packages/network/certbot"
  vars:
    certbot_install_method: package
    certbot_create_if_missing: true
    certbot_create_standalone_stop_services:
      - nginx
    certbot_auto_renew: true
    certbot_auto_renew_hour: "3"
    certbot_auto_renew_minute: "30"
    certbot_admin_email: "{{ nginx_certbot_admin_email }}"
    certbot_cloudflare_email: "{{ nginx_certbot_cloudflare_email }}"
    certbot_cloudflare_api_key: "{{ nginx_certbot_cloudflare_api_key }}"
    certbot_certs:
      - domains:
          - "*.puhome.net"
          - "puhome.net"

- name: Initialize vhosts list with default redirect
  ansible.builtin.set_fact:
    nginx_vhosts_list: []

- name: Add dynamic vhosts for each service
  ansible.builtin.set_fact:
    nginx_vhosts_list: "{{ nginx_vhosts_list + [vhost_item] }}"
  loop: "{{ service_mapping }}"
  when: item.nginx is not defined or item.nginx | bool
  vars:
    vhost_item:
      listen: "443 ssl http2"
      server_name: "{{ item.name }}.{{ base_domain }}"
      extra_parameters: |
        location / {
          proxy_pass http://{{ item.host }}.host.{{ base_domain }}:{{ item.port }}/;
          proxy_set_header Host $http_host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection 'upgrade';
        }
        ssl_certificate     /etc/letsencrypt/live/puhome.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/puhome.net/privkey.pem;
        ssl_protocols       TLSv1.1 TLSv1.2;
        ssl_ciphers         HIGH:!aNULL:!MD5;

- name: Add dynamic vhosts for each cockpit server
  ansible.builtin.set_fact:
    nginx_vhosts_list: "{{ nginx_vhosts_list + [vhost_item] }}"
  vars:
    vhost_item:
      listen: "443 ssl http2"
      server_name: "cockpit.{{ base_domain }}"
      extra_parameters: |
        location ~ ^/([a-zA-Z0-9\-]+)(/.*)?$ {
          set $sub_path $2;
          if ($sub_path = "") {
              set $sub_path "/";
          }
          if ($is_allowed_cockpit = 0) {
              return 403;
          }
          proxy_pass https://$cockpit_host_name.{{ base_domain }}:9090$sub_path;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_ssl_verify off;
        }
        ssl_certificate     /etc/letsencrypt/live/puhome.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/puhome.net/privkey.pem;
        ssl_protocols       TLSv1.1 TLSv1.2;
        ssl_ciphers         HIGH:!aNULL:!MD5;

- name: Install and configure Nginx
  ansible.builtin.import_role:
    name: geerlingguy.nginx
  vars:
    nginx_error_log: "/var/log/nginx/error.log warn"
    nginx_access_log: "/var/log/nginx/access.log main buffer=16k flush=2m"
    nginx_client_max_body_size: "1024m"
    nginx_vhosts: "{{ nginx_vhosts_list }}"
    nginx_extra_http_options: |
      map $uri $cockpit_host_name {
          ~^/([a-zA-Z0-9\-]+) $1;
          default "";
      }
      map $cockpit_host_name $is_allowed_cockpit {
          default 0;
      {% for h in nginx_cockpit_hosts %}
          {{ h }} 1;
      {% endfor %}
      }
      resolver {{ nginx_resolver }} valid=300s;
      resolver_timeout 10s;
  become: true