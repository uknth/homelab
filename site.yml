---
# site.yml — master playbook
#
# Usage:
#   ansible-playbook site.yml                          # full run
#   ansible-playbook site.yml --tags "bootstrap,linux" # bootstrap linux only
#   ansible-playbook site.yml --tags "cmp01"             # cmp01 services only
#   ansible-playbook site.yml --tags "arr,jellyfin"    # specific services only

# Phase 1 — bootstrap roles built and run on the Linux fleet (2026-08-22).
- name: Bootstrap Linux hosts
  ansible.builtin.import_playbook: playbooks/bootstrap/linux.yml

- name: Bootstrap macOS hosts
  ansible.builtin.import_playbook: playbooks/bootstrap/macos.yml

# Phase 2 — gateway (Blocky live; tailscale/certbot/nginx being deployed 2026-08-22).
- name: Gateway services (gw01)
  ansible.builtin.import_playbook: playbooks/hosts/gw01.yml

# Phase 2 — Pi-hole conditional-forward to Blocky (dns01).
- name: DNS appliance (dns01)
  ansible.builtin.import_playbook: playbooks/hosts/dns01.yml

