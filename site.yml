---
# site.yml — master playbook
#
# Usage:
#   ansible-playbook site.yml                          # full run
#   ansible-playbook site.yml --tags "bootstrap,linux" # bootstrap linux only
#   ansible-playbook site.yml --tags "cmp01"             # cmp01 services only
#   ansible-playbook site.yml --tags "arr,jellyfin"    # specific services only

# Phase 1 — bootstrap roles built and run on the Linux fleet (2026-08-22).
- name: Bootstrap Linux hosts
  ansible.builtin.import_playbook: playbooks/bootstrap/linux.yml

- name: Bootstrap macOS hosts
  ansible.builtin.import_playbook: playbooks/bootstrap/macos.yml

# Phase 2 — gateway (Blocky live; tailscale/certbot/nginx being deployed 2026-08-22).
- name: Gateway services (gw01)
  ansible.builtin.import_playbook: playbooks/hosts/gw01.yml

# Phase 2 — Pi-hole conditional-forward to Blocky (dns01).
- name: DNS appliance (dns01)
  ansible.builtin.import_playbook: playbooks/hosts/dns01.yml

# Phase 3 — TrueNAS NFS export management via API (nas01, runs on control node).
- name: Storage exports (nas01)
  ansible.builtin.import_playbook: playbooks/hosts/nas01.yml

# Phase 5 — compute/media/documents/music (cmp01). Uncommented 2026-08-30: the
# roles have been live since 2026-08-22, but the import was still commented out,
# so `site.yml` (and therefore the GitOps executor) never touched cmp01.
- name: Compute services (cmp01)
  ansible.builtin.import_playbook: playbooks/hosts/cmp01.yml

# Phase 4 — observability + SSO (util01).
- name: Utility services (util01)
  ansible.builtin.import_playbook: playbooks/hosts/util01.yml

# Remote management/monitoring agents (Portainer + Dozzle) on cmp01 + gw01.
- name: Docker agents (cmp01, gw01)
  ansible.builtin.import_playbook: playbooks/ops/agents.yml

#- name: Admin workstation (ctl01)
#  ansible.builtin.import_playbook: playbooks/hosts/ctl01.yml

#- name: AI workloads (ai01)
#  ansible.builtin.import_playbook: playbooks/hosts/ai01.yml

# Phase 6 — backups (restic -> nas02, SFTP). Scoped to Paperless + Syncthing.
- name: Backups (backup_clients)
  ansible.builtin.import_playbook: playbooks/ops/backups.yml

# Phase 6 — OS patching. Opt-in only: runs with `--tags patch`.
- name: OS patching (opt-in)
  ansible.builtin.import_playbook: playbooks/ops/patch.yml
  tags: [patch, never]
