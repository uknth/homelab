[defaults]
inventory           = hosts/hosts.yml
host_key_checking   = False
roles_path          = roles
# Vault password read from a local, git-ignored file outside the repo so runs
# are non-interactive on this control node. Each control node creates its own
# copy (chmod 600); the file is never committed. See docs/spec/conventions.md.
vault_password_file = ~/.config/homelab/.vault_pass
