[defaults]
inventory           = hosts/hosts.yml
host_key_checking   = False
roles_path          = roles
# Vault password read from a local, git-ignored file outside the repo so runs
# are non-interactive on this control node. Each control node creates its own
# copy (chmod 600); the file is never committed. See docs/spec/conventions.md.
vault_password_file = ~/.config/homelab/.vault_pass

[ssh_connection]
# Long-running tasks hold a single SSH channel open for many minutes with no
# output — a 17 GB model pull (services/ai/omlx), a Homebrew upgrade that
# rebuilds llvm, a restic run over a slow link. Without keepalives the
# connection is torn down and Ansible reports UNREACHABLE even though the
# remote command completed successfully: observed on ai01 during the omlx
# 0.4.4rc1 -> 0.6.4 upgrade, which finished on the host while the play failed.
#
# 30s x 120 = one hour of silence tolerated. ControlPersist is raised from the
# 60s default for the same reason.
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30 -o ServerAliveCountMax=120
