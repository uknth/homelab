# builds.sr.ht CI for ~uknth/homelab — static checks only, NO secrets.
# On a push, git.sr.ht runs this with the repo checked out at the pushed commit.
# It never decrypts the vault or connects to a host: syntax-check parses only,
# and we strip vault_password_file from ansible.cfg so no passphrase is needed.
# The real dry-run (--check) + apply happen on-LAN via n8n on util01 (see
# docs/plan/gitops.md), which is where the secrets live.
image: debian/bookworm
packages:
  - python3
  - python3-venv
environment:
  REPO: homelab
tasks:
  - deps: |
      python3 -m venv ~/v
      ~/v/bin/pip install -q --upgrade pip
      ~/v/bin/pip install -q ansible ansible-lint
  - ci-config: |
      cd $REPO
      # CI ansible.cfg = the repo's, minus the (absent) vault password file.
      grep -v vault_password_file ansible.cfg > ci.cfg
  - syntax-check: |
      cd $REPO
      ANSIBLE_CONFIG=ci.cfg ~/v/bin/ansible-playbook site.yml --syntax-check
  - lint: |
      cd $REPO
      # Advisory for now (existing codebase); tighten to blocking later.
      ANSIBLE_CONFIG=ci.cfg ~/v/bin/ansible-lint --nocolor || true
